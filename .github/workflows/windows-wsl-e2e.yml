name: Windows WSL terminal E2E

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit to validate
        type: string
        required: false
  workflow_call:
    inputs:
      ref:
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: windows-wsl-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  wsl-terminal:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-wsl-test-runtime
      - name: Probe WSL filesystem behavior
        run: node config/scripts/wsl-filesystem-probe.cjs
