name: Windows WSL terminal E2E

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit to validate
        type: string
        required: false
  workflow_call:
    inputs:
      ref:
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: windows-wsl-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  wsl-terminal:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      ORCA_BACKGROUND_LAUNCH: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: electron
      - name: Build relay and Electron
        run: |
          pnpm run build:wsl-guest
          if ($LASTEXITCODE -ne 0) { throw 'Relay build failed' }
          pnpm exec electron-vite build --mode e2e
          if ($LASTEXITCODE -ne 0) { throw 'Electron build failed' }
      - name: Verify cache controls repeatedly on native Windows
        env:
          SKIP_BUILD: '1'
          ORCA_BACKGROUND_LAUNCH: '1'
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/image-ready-results.json
        run: >-
          pnpm exec playwright test
          tests/e2e/terminal-inline-image-cache.spec.ts
          --config tests/playwright.config.ts
          --project=electron-headless
          --project=electron-headful
          --output=test-results/image-ready
          --workers=1
          --repeat-each=3
          --retries=0
          --reporter=list,json
      - name: Require all six cache executions
        if: always()
        run: >-
          node -e "const s = require('./test-results/image-ready-results.json').stats;
          if (s.expected !== 6 || s.unexpected || s.flaky || s.skipped)
          throw new Error(JSON.stringify(s)); console.log(JSON.stringify(s))"
      - name: Upload image reliability proof
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-image-ready-proof
          path: |
            test-results/image-ready/**
            test-results/image-ready-results.json
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: windows-wsl-terminal-traces
          path: test-results/
          retention-days: 7
