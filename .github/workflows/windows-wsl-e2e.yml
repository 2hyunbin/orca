name: Windows WSL terminal E2E

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit to validate
        type: string
        required: false
  workflow_call:
    inputs:
      ref:
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: windows-wsl-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  wsl-terminal:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      ORCA_BACKGROUND_LAUNCH: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: electron
      - name: Build relay and Electron
        run: |
          pnpm run build:wsl-guest
          if ($LASTEXITCODE -ne 0) { throw 'Relay build failed' }
          pnpm exec electron-vite build --mode e2e
          if ($LASTEXITCODE -ne 0) { throw 'Electron build failed' }
      - name: Capture placement controls with bundled runtime
        continue-on-error: true
        env:
          SKIP_BUILD: '1'
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/image-ready-old-results.json
        run: >-
          pnpm exec playwright test tests/e2e/terminal-inline-image-cache-diagnostic.spec.ts
          --config tests/playwright.config.ts --project=electron-headless
          --workers=1 --retries=0 --reporter=list,json --output=test-results/image-ready-old
      - name: Install verified stable runtime for isolated comparison
        run: |
          $package = Join-Path $env:RUNNER_TEMP 'conpty-stable.nupkg'
          Invoke-WebRequest 'https://github.com/microsoft/terminal/releases/download/v1.25.2733.0/Microsoft.Windows.Console.ConPTY.1.25.260930003.nupkg' -OutFile $package
          if ((Get-FileHash $package -Algorithm SHA256).Hash.ToLowerInvariant() -ne '6d6f8b008c655d814c498d8205d4012dcd4d0b6dfc1096461d0a185d1e3caf03') { throw 'Runtime digest mismatch' }
          $unpacked = Join-Path $env:RUNNER_TEMP 'conpty-stable'
          [System.IO.Compression.ZipFile]::ExtractToDirectory($package, $unpacked)
          $runtime = Join-Path (Resolve-Path node_modules/node-pty).Path 'build/Release/conpty'
          Copy-Item (Join-Path $unpacked 'runtimes/win-x64/native/conpty.dll') (Join-Path $runtime 'conpty.dll') -Force
          Copy-Item (Join-Path $unpacked 'build/native/runtimes/x64/OpenConsole.exe') (Join-Path $runtime 'OpenConsole.exe') -Force
          Get-ChildItem $runtime | ForEach-Object { $_.VersionInfo.FileVersion; Get-FileHash $_.FullName -Algorithm SHA256 } | Out-File test-results/image-ready-runtime-version.txt
      - name: Capture same placement controls with stable runtime
        env:
          SKIP_BUILD: '1'
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/image-ready-new-results.json
        run: >-
          pnpm exec playwright test tests/e2e/terminal-inline-image-cache-diagnostic.spec.ts
          --config tests/playwright.config.ts --project=electron-headless
          --workers=1 --retries=0 --reporter=list,json --output=test-results/image-ready-new
      - name: Require stable runtime participation
        if: always()
        run: >-
          node -e "const s = require('./test-results/image-ready-new-results.json').stats;
          if (s.expected !== 1 || s.unexpected || s.flaky || s.skipped)
          throw new Error(JSON.stringify(s)); console.log(JSON.stringify(s))"
      - name: Upload paired diagnostics
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-cache-diagnostic-proof
          path: test-results/image-ready-*
          retention-days: 7
          if-no-files-found: error
