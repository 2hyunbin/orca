name: Windows inline image verification
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact image candidate to validate
        type: string
        required: true
permissions:
  contents: read
jobs:
  images:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      ORCA_BACKGROUND_LAUNCH: '1'
      ORCA_E2E_HEADLESS: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: ./.github/actions/setup-wsl-test-runtime
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: electron
      - name: Build current application and CLI
        run: |
          pnpm exec electron-vite build --mode e2e
          if ($LASTEXITCODE -ne 0) { throw 'Electron build failed' }
          pnpm run build:cli
          if ($LASTEXITCODE -ne 0) { throw 'CLI build failed' }
      - name: Validate native and WSL images
        env:
          SKIP_BUILD: '1'
          ORCA_E2E_FORWARD_APP_LOGS: '1'
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/images.json
        run: >-
          pnpm exec playwright test
          tests/e2e/terminal-kitty-placeholders.spec.ts
          tests/e2e/terminal-inline-images-windows.spec.ts
          --config tests/playwright.config.ts
          --project=electron-headless
          --project=electron-headful
          --workers=1
          --reporter=list,json
      - name: Require all fourteen executions
        if: always()
        run: >-
          node -e "const fs=require('node:fs');const r=JSON.parse(fs.readFileSync('test-results/images.json','utf8'));if(r.stats.expected!==14||r.stats.unexpected||r.stats.skipped||r.stats.flaky)throw Error(JSON.stringify(r.stats));console.log(r.stats)"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-inline-image-evidence
          path: test-results/
          retention-days: 7
