name: Windows native preparation comparison

on:
  workflow_dispatch:
    inputs:
      comparison:
        description: Bounded comparison to run on the existing Windows slots.
        type: choice
        default: native-preparation
        options: [native-preparation, windows-security, node-server-workers, node-server-cache]
      source_sha:
        description: Exact commit containing this benchmark and the Windows compiler candidate.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: windows-native-preparation-comparison-${{ github.ref }}
  cancel-in-progress: false

env:
  ORCA_BACKGROUND_LAUNCH: '1'

jobs:
  compare:
    name: Native preparation comparison (${{ matrix.os }})
    runs-on: ${{ startsWith(inputs.comparison, 'node-server-') && 'orca-windows-11-arm64-8core' || matrix.os }}
    timeout-minutes: 60
    env:
      JOBS: ${{ startsWith(inputs.comparison, 'node-server-') && 'max' || '' }}
      TrackFileAccess: ${{ startsWith(inputs.comparison, 'node-server-') && 'false' || '' }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: ${{ fromJSON(startsWith(inputs.comparison, 'node-server-') && '["windows-11-arm"]' || '["windows-2022","windows-11-arm"]') }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Record measurement start and validate source
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          mkdir -p .build/windows-native-benchmark
          node -e 'require("node:fs").writeFileSync(".build/windows-native-benchmark/job-start.json", JSON.stringify({startedAt:new Date().toISOString()}))'
      - uses: ./.github/actions/install-node-dependencies
        with:
          node-version: '24.21.0'
          native-runtime: ${{ startsWith(inputs.comparison, 'node-server-') && 'node' || 'none' }}
          cache-pnpm-store: 'false'
          cache-pnpm-verification: 'false'
      - name: Compare isolated cold and same-build warm preparation
        if: inputs.comparison == 'native-preparation'
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          BENCHMARK_RUNNER: ${{ matrix.os }}
        run: node config/scripts/benchmark-windows-native-preparation.mjs
      - name: Compare warm Windows security builds and qualify fallback
        if: inputs.comparison == 'windows-security'
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          BENCHMARK_RUNNER: ${{ matrix.os }}
        run: node config/scripts/benchmark-windows-security-reuse.mjs
      - uses: ./.github/actions/prepare-orcad-prebuilds
        id: server-prebuild
        if: startsWith(inputs.comparison, 'node-server-')
        with:
          resolve-windows-cache: 'true'
          restore-windows-cache: 'true'
      - uses: ./.github/actions/prepare-windows-cli-launcher
        if: startsWith(inputs.comparison, 'node-server-')
        with:
          arches: arm64
      - uses: ./.github/actions/build-mobile-web-bundle
        if: startsWith(inputs.comparison, 'node-server-')
      - name: Build the qualified server candidate
        if: startsWith(inputs.comparison, 'node-server-')
        run: pnpm build:orcad
        env:
          ORCA_REUSE_PREPARED_WINDOWS_SECURITY: 'true'
      - name: Compare qualification test workers
        if: inputs.comparison == 'node-server-workers'
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: node config/scripts/benchmark-node-server-workers.mjs
      - name: Qualify the cold server slot
        if: inputs.comparison == 'node-server-cache'
        run: pnpm test:node-server --artifact
      - name: Save the qualified server slot
        if: inputs.comparison == 'node-server-cache'
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.server-prebuild.outputs.cache-path }}
          key: ${{ steps.server-prebuild.outputs.cache-key }}
      - name: Simulate the next app version
        if: inputs.comparison == 'node-server-cache'
        shell: bash
        run: |
          cp package.json "$RUNNER_TEMP/prebuild-cache-package.json"
          node -e 'const fs = require("node:fs"); const p = JSON.parse(fs.readFileSync("package.json", "utf8")); p.version = "999.0.0"; fs.writeFileSync("package.json", JSON.stringify(p))'
          rm -rf out/orcad-prebuilds
      - uses: ./.github/actions/prepare-orcad-prebuilds
        id: versioned-server-prebuild
        if: inputs.comparison == 'node-server-cache'
        with:
          resolve-windows-cache: 'true'
          restore-windows-cache: 'true'
      - name: Require a validated cache hit across the version bump
        if: inputs.comparison == 'node-server-cache'
        shell: bash
        env:
          CACHE_HIT: ${{ steps.versioned-server-prebuild.outputs.cache-hit }}
          COLD_KEY: ${{ steps.server-prebuild.outputs.cache-key }}
          WARM_KEY: ${{ steps.versioned-server-prebuild.outputs.cache-key }}
        run: |
          cp "$RUNNER_TEMP/prebuild-cache-package.json" package.json
          test "$CACHE_HIT" = true
          test "$COLD_KEY" = "$WARM_KEY"
          git diff --exit-code -- package.json
      - name: Qualify the restored server slot
        if: inputs.comparison == 'node-server-cache'
        run: pnpm test:node-server --artifact
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-native-preparation-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .build/windows-native-benchmark/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
