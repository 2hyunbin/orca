name: Managed hook PSModulePath environment control
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hook-stdin-psmodulepath-${{ github.run_id }}
  cancel-in-progress: false
env:
  ORCA_BACKGROUND_LAUNCH: '1'
jobs:
  control:
    name: Hook env (${{ matrix.source.name }}, ${{ matrix.environment }})
    runs-on: windows-2022
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        environment: [original, sanitized]
        source:
          - name: pristine-refactor-base
            sha: 5ee74f4f83ddb7da960e37783e3008375d189a38
          - name: tested-candidate-integration
            sha: e50aa599d3fc8cc5b491504cd76406b2e95b722f
    env:
      EXPECTED_SHA: ${{ matrix.source.sha }}
      VALIDATION_MODE: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.source.sha }}
          persist-credentials: false
      - name: Stage validation driver (1/2)
        shell: bash
        run: |
          mkdir -p .build/hook-stdin-psmodulepath-validation
          cat > .build/hook-stdin-psmodulepath-validation/validate.cjs <<'VALIDATION_JS'
          const fs = require('node:fs')
          const path = require('node:path')
          const crypto = require('node:crypto')
          const cp = require('node:child_process')
          const spec = {"fixture":"src/main/agent-hooks/managed-hook-stdin-lifecycle.test.ts","contract":"src/main/agent-hooks/hook-stdin-contract.ts","originalBlob":"30d0d04abaf12d02730db2e5a3b9212b500283b6","originalSha256":"b7a151d4b38844ca0e9cdb5c52da6349f2a0b418e75fce6e8be3f19c98e958c2","candidateSha256":"e70f191600791dd3cff213c45c22692d8d73d3a9ca79a5ea6fa39fb862061f88","patchSha256":"158fd223fcef0ed354f20729025f82181d4c6162e6bb13d12efb1c5287ee9e57","patchBase64":"","contractSha256":"f98803ba88aaa268ca2e8cad6fd8a3e2f79e9fcec10909b6f5a48939cde56256","contractBlob":"1c881843d1fc315b901cc5642dd2498379f7d66c","guardAnchor":").join(' -or ')}) { exit 0 }`","guardMutant":").join(' -or ')}) { }`","mutantContractSha256":"8f8dfccd3fe24f608c6886ebf908978ab8ad066a0580cfaf000b60d2f9c81c67","negativeFixtureSha256":"cd15fa5a2895d9e04db3d77f71dab8eb3fb677ceb02be60c8c19aa1c3ce395b4","smokeFixtureSha256":"825220093e422d906919501b29cda90775477a0cdbd538145c9d0c0e740b5a9e","files":["config/scripts/build-windows-cli-launcher.test.mjs","config/scripts/electron-builder-runtime-resources.test.mjs","config/scripts/ensure-native-runtime-job-ownership.test.mjs","config/scripts/package-electron-runtime-contract.test.mjs","config/scripts/rebuild-native-deps-node-pty.test.mjs","config/scripts/rebuild-native-deps-windows-process-tree.test.mjs","config/scripts/rebuild-native-deps.test.mjs","config/scripts/script-module-dependencies.test.mjs","config/scripts/verify-packaged-node-pty-job-ownership.test.mjs","config/scripts/verify-packaged-windows-agent-hook.test.mjs","config/scripts/windows-pe-machine.test.mjs","config/scripts/windows-process-tree-gyp-path.test.mjs","config/scripts/windows-process-tree-gyp-rebuild.test.mjs","src/main/agent-hooks/managed-hook-stdin-lifecycle.test.ts","src/main/agent-hooks/windows-batch-hook-launcher.test.ts","src/main/agent-hooks/windows-cmd-hook-command-unicode.test.ts","src/main/agent-hooks/windows-direct-cmd-hook-command.test.ts","src/main/agent-hooks/windows-hook-payload-delivery.test.ts","src/main/agent-hooks/windows-native-hook-exe-hosts.test.ts","src/main/agent-hooks/windows-powershell-hook-launcher.test.ts","src/main/browser/browser-client-page-renderer-lifecycle.electron.test.ts","src/main/browser/browser-route-dns-prefetch.electron.test.ts","src/main/browser/browser-route-h3-egress.electron.test.ts","src/main/browser/browser-route-tcp-egress.electron.test.ts","src/main/browser/browser-route-webrtc-egress.electron.test.ts","src/main/claude-accounts/claude-profile-history-windows.test.ts","src/main/claude/claude-status-line-windows.test.ts","src/main/claude/windows-native-hook-registration.test.ts","src/main/cli/wsl-cli-powershell-boundary.test.ts","src/main/codex/hook-service-managed-install.test.ts","src/main/codex/windows-hook-command.test.ts","src/main/codex/windows-hook-upgrade.test.ts","src/main/computer/desktop-script-runtime-host.win32.test.ts","src/main/cursor/hook-service.test.ts","src/main/daemon/daemon-host-process-package.test.ts","src/main/daemon/daemon-pid-identity-native.win32.test.ts","src/main/ipc/preflight-provider-command-selection.test.ts","src/main/ipc/preflight-runnable-local-cli.test.ts","src/main/ipc/pty-codex-account-attribution.test.ts","src/main/ipc/pty-spawn-env-codex-resume-provenance.test.ts","src/main/jcode/hook-gate-script.test.ts","src/main/managed-server/install/remote-node-runtime-store-windows.test.ts","src/main/orca-profiles/profile-index-store.test.ts","src/main/persistence/profile-state/profile-state-access-windows-native.win32.test.ts","src/main/persistence/profile-state/profile-state-writer-stall.electron.test.ts","src/main/providers/agent-foreground-process-git-bash.win32.test.ts","src/main/providers/pty-repaint-wide-char-buffer.node-pty.test.ts","src/main/providers/windows-conpty-wide-char-duplication.node-pty.test.ts","src/main/runtime/repo-worktree-admin-fingerprint.test.ts","src/main/runtime/unreadable-secret-store-preservation.win32.test.ts","src/main/runtime/worktree-scan-admin-fingerprint-gate.test.ts","src/main/skills/bundled-skill-install/local-host.test.ts","src/main/skills/bundled-skill-install/plan-selection.test.ts","src/main/skills/skill-windows-rename-contention.integration.test.ts","src/main/startup/windows-app-data-path.test.ts","src/main/startup/windows-install-dir-acl-repair.win32.test.ts","src/main/windows-live-tree-kill.win32.test.ts","src/main/windows-registry-addon.test.ts","src/main/windows/windows-administrator-restart.win32.test.ts","src/main/windows/windows-administrator-status.win32.test.ts","src/main/windows/windows-host-job.win32.test.ts","src/main/windows/windows-msys-job.win32.test.ts","src/main/windows/windows-process-table-native-addon.win32.test.ts","src/main/windows/windows-process-tree-command-line-patch.test.ts","src/main/windows/windows-pty-job.win32.test.ts","src/main/wsl/wsl-executable-path.win32.test.ts","src/main/wsl/wsl-guest-environment.test.ts","src/main/wsl/wsl-runner.test.ts","src/main/wsl/wsl-w1-w3-contract.test.ts","src/main/zcode/zcode-plan-api-key-store-native-windows.test.ts","src/shared/__tests__/process-host/windows-cmd-shim-resolution.test.ts","src/shared/__tests__/process-host/windows-cmd-shim-resolution.win32.test.ts","src/shared/__tests__/process-host/windows-command-line.win32.test.ts","src/shared/__tests__/process-host/windows-tree-kill-late-taskkill.win32.test.ts","src/shared/omp-fresh-launch-cmd.win32.test.ts","src/shared/secure-file-fsync-flags.test.ts","src/shared/secure-path-windows-acl.win32.test.ts","src/shared/source-scan/source-tree-scan.test.ts","src/shared/windows-security-addon.win32.test.ts"],"fixtureNames":["Windows managed hook stdin structure emits parseable JSON on stdout from the registered Claude hook command (claude-hook.cmd), through cmd.exe and Git Bash","Windows managed hook stdin structure emits parseable JSON on stdout from the registered Claude hook command (orca-agent-hook.exe claude), through cmd.exe and Git Bash","Windows managed hook stdin structure exits 0 for every local script and missing-script launcher, dropping stdin only without Orca env","Windows managed hook stdin structure exits immediately when Orca env is missing and keeps drain for other failures","managed hook stdin lifecycle accepts a large payload across generated hooks without breaking the writer","managed hook stdin lifecycle captures stdin before every possible whole-script success exit","managed hook stdin lifecycle captures the whole payload with PATH whose first cat is a decoy","managed hook stdin lifecycle captures the whole payload with PATH without coreutils","managed hook stdin lifecycle captures the whole payload with empty PATH","managed hook stdin lifecycle does not need PATH to capture or drain POSIX hook stdin","managed hook stdin lifecycle drains a large payload when the configured script is missing","managed hook stdin lifecycle drains before Claude skips hooks imported by Devin","managed hook stdin lifecycle emits neutral JSON when the Claude lifecycle script is missing"],"identitiesSha256":"0d631ae2c6b2fe701d06503efbc5ea6197d941cdf8dd91c6af10f6b8c741a028","liveTitle":"exits 0 for every local script and missing-script launcher, dropping stdin only without Orca env","liveFullName":"Windows managed hook stdin structure exits 0 for every local script and missing-script launcher, dropping stdin only without Orca env","sources":[{"name":"pristine-refactor-base","sha":"5ee74f4f83ddb7da960e37783e3008375d189a38","tree":"2738db65280beb05c8bf13815007a93a6d5660c7"},{"name":"tested-candidate-integration","sha":"e50aa599d3fc8cc5b491504cd76406b2e95b722f","tree":"281bffa07dd2f44b82f4ecdf688098fddb88a62a"}]}
          const out = '.build/hook-stdin-psmodulepath-validation'
          const fixture = spec.fixture
          const contract = spec.contract
          const mode = process.argv[2]
          const hash = (bytes) => crypto.createHash('sha256').update(bytes).digest('hex')
          const read = (p) => fs.readFileSync(p, 'utf8')
          const write = (p, value) => fs.writeFileSync(path.join(out, p), value)
          const json = (p, value) => write(p, JSON.stringify(value, null, 2) + '\n')
          const assert = (condition, message) => { if (!condition) throw new Error(message) }
          const git = (...args) => {
            const result = cp.spawnSync('git', args, { encoding: 'utf8', env: { ...process.env, GIT_NO_LAZY_FETCH: '1' } })
            assert(result.status === 0, `git ${args[0]} failed: ${result.stderr}`)
            return result.stdout
          }
          const replaceOnce = (text, from, to) => {
            assert(text.split(from).length === 2, `Nonunique anchor: ${from}`)
            return text.replace(from, to)
          }
          const snapshot = (phase, expectedPaths) => {
            const changed = git('diff', '--name-only').trim().split(/\r?\n/).filter(Boolean).sort()
            assert(JSON.stringify(changed) === JSON.stringify([...expectedPaths].sort()), `${phase}: unexpected tracked paths ${changed}`)
            const diff = git('diff', '--no-ext-diff', '--binary', '--', fixture, contract)
            write(`${phase}.diff`, diff)
            const record = { phase, head: git('rev-parse', 'HEAD').trim(), changed, fixtureSha256: hash(fs.readFileSync(fixture)), contractSha256: hash(fs.readFileSync(contract)), diffSha256: hash(diff), stagedDiff: git('diff', '--cached', '--name-only').trim(), status: git('status', '--porcelain=v1', '--untracked-files=no') }
            assert(record.stagedDiff === '', 'Unexpected staged change')
            json(`${phase}-binding.json`, record)
            return record
          }
          const canonicalRows = (results) => results.testResults.flatMap((suite) => {
            const normalized = suite.name.replaceAll('\\', '/')
            const file = spec.files.find((f) => normalized.endsWith('/' + f))
            assert(file, `Unexpected suite: ${normalized}`)
            return suite.assertionResults.map((test) => ({ file, name: test.fullName, status: test.status }))
          }).sort((a, b) => JSON.stringify(a) < JSON.stringify(b) ? -1 : JSON.stringify(a) > JSON.stringify(b) ? 1 : 0)
          const verifySingle = (results, expectedStatus) => {
            assert(results.testResults.length === 1, 'Expected exactly one test file')
            assert(results.numTotalTests === 13 && results.numPendingTests === 12, 'Changed live-case selection or skip count')
            const rows = canonicalRows(results)
            const selected = rows.filter((t) => t.status !== 'skipped' && t.status !== 'pending')
            assert(selected.length === 1 && selected[0].file === fixture && selected[0].name === spec.liveFullName && selected[0].status === expectedStatus, 'Wrong selected assertion')
            const expectedNames = spec.fixtureNames
            assert(JSON.stringify(rows.map((t) => t.name).sort()) === JSON.stringify(expectedNames), 'Fixture assertion identities changed')
            return results.testResults[0].assertionResults.find((t) => t.fullName === spec.liveFullName)
          }
          fs.mkdirSync(out, { recursive: true })
          if (mode === 'init') {
            const expected = spec.sources.find((s) => s.sha === process.env.EXPECTED_SHA)
            assert(expected && git('rev-parse', 'HEAD').trim() === expected.sha, 'Wrong pinned source')
            assert(git('rev-parse', 'HEAD^{tree}').trim() === expected.tree, 'Wrong pinned source tree')
            assert(git('status', '--porcelain=v1', '--untracked-files=no').trim() === '', 'Dirty initial tracked checkout')
            assert(hash(fs.readFileSync(fixture)) === spec.originalSha256, 'Original fixture hash mismatch')
            assert(git('rev-parse', `HEAD:${fixture}`).trim() === spec.originalBlob, 'Original fixture blob mismatch')
            assert(hash(fs.readFileSync(contract)) === spec.contractSha256, 'Original contract hash mismatch')
            assert(git('rev-parse', `HEAD:${contract}`).trim() === spec.contractBlob, 'Original contract blob mismatch')
            fs.copyFileSync(fixture, path.join(out, 'original-managed-hook-stdin-lifecycle.test.ts'))
            fs.copyFileSync(contract, path.join(out, 'original-hook-stdin-contract.ts'))
            write('candidate.patch', Buffer.from(spec.patchBase64, 'base64'))
            assert(hash(fs.readFileSync(path.join(out, 'candidate.patch'))) === spec.patchSha256, 'Inline patch mismatch')
            json('spec.json', spec)
            json('source.json', { ...expected, runnerImage: process.env.ImageVersion, runnerOS: process.env.RUNNER_OS, backgroundLaunch: process.env.ORCA_BACKGROUND_LAUNCH })
            assert(process.env.ORCA_BACKGROUND_LAUNCH === '1', 'Background launch must be enabled')
            const modulePaths = Object.entries(process.env).filter(([key]) => key.toLowerCase() === 'psmodulepath').map(([key, value]) => ({ key, value: value.slice(0, 4096), length: value.length, truncated: value.length > 4096, sha256: hash(value) }))
            json('inherited-psmodulepath.json', { capturedBeforeTests: true, entries: modulePaths })
            snapshot('original', [])
          } else if (mode === 'environment') {
            const entries = Object.entries(process.env).filter(([key]) => key.toLowerCase() === 'psmodulepath').map(([key, value]) => ({ key, value: value.slice(0, 4096), length: value.length, truncated: value.length > 4096, sha256: hash(value) }))
            json('full-inherited-psmodulepath.json', { capturedImmediatelyBeforeFullVitest: true, entries })
          } else if (mode === 'patch') {
            assert(hash(fs.readFileSync(fixture)) === spec.originalSha256, 'Patch must start from original fixture')
            git('apply', '--check', path.join(out, 'candidate.patch'))
            git('apply', path.join(out, 'candidate.patch'))
            assert(hash(fs.readFileSync(fixture)) === spec.candidateSha256, 'Patched fixture hash mismatch')
            fs.copyFileSync(fixture, path.join(out, 'patched-managed-hook-stdin-lifecycle.test.ts'))
            snapshot('patched', [fixture])
          } else if (mode === 'negative') {
            assert(hash(fs.readFileSync(fixture)) === spec.candidateSha256, 'Negative control must start from exact candidate')
            assert(hash(fs.readFileSync(contract)) === spec.contractSha256, 'Negative contract must start original')
            const mutatedContract = replaceOnce(read(contract), spec.guardAnchor, spec.guardMutant)
            assert(hash(mutatedContract) === spec.mutantContractSha256, 'Unexpected contract mutant')
            fs.writeFileSync(contract, mutatedContract)
            let instrumented = replaceOnce(read(fixture), '    const child = spawnProcess({', "    const diagnosticStarted = Date.now()\n    const diagnosticLauncher = args.some((arg) => arg.includes('-EncodedCommand')) ? 'encoded-powershell' : 'other-launcher'\n    const child = spawnProcess({")
            instrumented = replaceOnce(instrumented, '      reject(new Error(`hook did not finish with stdin ${stdin}d`))', '      reject(new Error(`hook did not finish with stdin ${stdin}d: ${executable} ${diagnosticLauncher}; elapsedMs=${Date.now() - diagnosticStarted}; watchdogMs=10000`))')
            assert(instrumented.split('}, 10_000)').length === 2, 'Negative watchdog changed')
            assert(hash(instrumented) === spec.negativeFixtureSha256, 'Unexpected negative instrumentation')
            fs.writeFileSync(fixture, instrumented)
            fs.copyFileSync(fixture, path.join(out, 'negative-managed-hook-stdin-lifecycle.test.ts'))
            fs.copyFileSync(contract, path.join(out, 'mutant-hook-stdin-contract.ts'))
            snapshot('negative', [fixture, contract])
          } else if (mode === 'original') {
            assert(hash(fs.readFileSync(fixture)) === spec.originalSha256 && hash(fs.readFileSync(contract)) === spec.contractSha256, 'Original control changed')
            snapshot('full-original', [])
          } else if (mode === 'restore') {
            fs.copyFileSync(path.join(out, 'original-managed-hook-stdin-lifecycle.test.ts'), fixture)
            fs.copyFileSync(path.join(out, 'original-hook-stdin-contract.ts'), contract)
            snapshot('restored', [])
          } else if (mode === 'verify') {
            const receipt = { success: false, mode: process.env.VALIDATION_MODE, source: JSON.parse(read(path.join(out, 'source.json'))), checkedAt: new Date().toISOString() }
            try {
              assert(hash(fs.readFileSync(fixture)) === spec.originalSha256 && hash(fs.readFileSync(contract)) === spec.contractSha256, 'Original source not restored')
              snapshot('final', [])
              if (['sanitized', 'original'].includes(process.env.VALIDATION_MODE)) {
                const full = JSON.parse(read(path.join(out, 'full-results.json')))
                receipt.fullObserved = { success: full.success, total: full.numTotalTests, passed: full.numPassedTests, failed: full.numFailedTests, skipped: full.numPendingTests, files: full.testResults.length, failures: full.testResults.flatMap((suite) => suite.assertionResults.filter((test) => test.status === 'failed').map((test) => ({ name: test.fullName, durationMs: test.duration, failureMessages: test.failureMessages }))) }
                assert(Number(read(path.join(out, 'full-exit-code.txt')).trim()) === 0, 'Full group command did not pass')
                assert(full.success === true && full.numTotalTests === 761 && full.numPassedTests === 704 && full.numFailedTests === 0 && full.numPendingTests === 57 && full.numTodoTests === 0, 'Full group counts changed or failed')
                assert(full.numFailedTestSuites === 0 && full.testResults.length === 79, 'Full group suite failure/count mismatch')
                assert(hash(JSON.stringify(canonicalRows(full))) === spec.identitiesSha256, 'Full group assertion identity/status mismatch')
                const fullBinding = JSON.parse(read(path.join(out, process.env.VALIDATION_MODE === 'sanitized' ? 'patched-binding.json' : 'full-original-binding.json')))
          VALIDATION_JS
      - name: Stage validation driver (2/2)
        shell: bash
        run: |
          mkdir -p .build/hook-stdin-psmodulepath-validation
          cat >> .build/hook-stdin-psmodulepath-validation/validate.cjs <<'VALIDATION_JS'
                assert(fullBinding.fixtureSha256 === (process.env.VALIDATION_MODE === 'sanitized' ? spec.candidateSha256 : spec.originalSha256) && fullBinding.contractSha256 === spec.contractSha256, 'Full group binding mismatch')
                Object.assign(receipt, { full: { passed: 704, failed: 0, skipped: 57, files: 79, assertionIdentitiesMatched: true, watchdogMs: 10000, beforeAllSetup: false }, fullBinding })
                if (process.env.VALIDATION_MODE === 'sanitized') {
                const negative = JSON.parse(read(path.join(out, 'negative-results.json')))
                assert(Number(read(path.join(out, 'negative-exit-code.txt')).trim()) === 1, 'Negative command must fail exactly as a test assertion')
                assert(negative.success === false && negative.numFailedTests === 1 && negative.numPassedTests === 0, 'Negative control did not fail exactly once')
                const failed = verifySingle(negative, 'failed')
                const failure = failed.failureMessages.join('\n')
                assert(failure.includes('hook did not finish with stdin abandond') && failure.includes('cmd.exe encoded-powershell') && failure.includes('watchdogMs=10000'), 'Wrong negative-control failure')
                const elapsed = Number(failure.match(/elapsedMs=(\d+)/)?.[1])
                assert(Number.isFinite(elapsed) && elapsed >= 10000 && failed.duration >= 10000, 'Negative deadline not observed at10s')
                const patched = JSON.parse(read(path.join(out, 'patched-binding.json')))
                const mutant = JSON.parse(read(path.join(out, 'negative-binding.json')))
                assert(patched.fixtureSha256 === spec.candidateSha256 && patched.contractSha256 === spec.contractSha256 && mutant.fixtureSha256 === spec.negativeFixtureSha256 && mutant.contractSha256 === spec.mutantContractSha256, 'Phase source binding mismatch')
                Object.assign(receipt, { full: { passed: 704, failed: 0, skipped: 57, files: 79, assertionIdentitiesMatched: true, watchdogMs: 10000, beforeAllSetup: false, jsonSha256: hash(JSON.stringify(full)) }, negative: { failed: 1, skipped: 12, selected: failed.fullName, durationMs: failed.duration, watchdogElapsedMs: elapsed, failureMessages: failed.failureMessages }, patched, mutant })
                }
              } else throw new Error('Unknown validation mode')
              receipt.success = true
            } catch (error) {
              receipt.error = error.stack
              process.exitCode = 1
            }
            json('validation-receipt.json', receipt)
            process.stdout.write(JSON.stringify(receipt, null, 2) + '\n')
          } else throw new Error(`Unknown mode ${mode}`)
          VALIDATION_JS
      - name: Verify pinned source and diagnostic driver
        shell: pwsh
        run: |
          if ((Get-FileHash .build/hook-stdin-psmodulepath-validation/validate.cjs -Algorithm SHA256).Hash.ToLowerInvariant() -ne '10cc8417bf6b9b4b791daaa816a18dc3fee7649e1e8842bf1185ed007395289d') { throw 'Validation driver mismatch' }
          node .build/hook-stdin-psmodulepath-validation/validate.cjs init
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content C:/image/imagedata.json -ErrorAction SilentlyContinue | Set-Content .build/hook-stdin-psmodulepath-validation/runner-image.json
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: node
          persist-native-cache: 'false'
          cache-dependency-path: |
            pnpm-lock.yaml
            mobile/pnpm-lock.yaml
      - uses: ./.github/actions/install-mobile-dependencies
      - name: Cache Windows launchers
        uses: actions/cache/restore@v5
        with:
          path: |
            native/windows-cli-launcher/.build
            native/windows-cli-launcher/target
            native/windows-agent-hook/.build
            native/windows-agent-hook/target
            ~/.cargo/registry
          key: windows-cli-launcher-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/windows-cli-launcher/**', 'native/windows-agent-hook/**', 'config/scripts/build-windows-cli-launcher.mjs', 'config/scripts/build-windows-agent-hook.mjs', 'config/scripts/windows-rust-executable-build.mjs', 'resources/build/icon.ico', 'package.json') }}
      - name: Build Windows hooks and launchers
        shell: pwsh
        run: |
          if (-not (Get-Command cargo -ErrorAction SilentlyContinue)) {
            rustup toolchain install stable --profile minimal
            rustup default stable
          }
          node config/scripts/build-windows-agent-hook.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node config/scripts/build-windows-cli-launcher.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Apply environment-only fixture candidate (sanitized jobs)
        if: matrix.environment == 'sanitized'
        shell: pwsh
        run: |
          node .build/hook-stdin-psmodulepath-validation/validate.cjs patch
          exit $LASTEXITCODE
      - name: Bind untouched original fixture (original jobs)
        if: matrix.environment == 'original'
        shell: pwsh
        run: |
          node .build/hook-stdin-psmodulepath-validation/validate.cjs original
          exit $LASTEXITCODE
      - name: Fresh full79-file Windows group (original10s hook deadline)
        id: full
        continue-on-error: true
        shell: pwsh
        env:
          ORCA_REAL_WINDOWS_SKILL_TEST: '1'
        run: |
          node .build/hook-stdin-psmodulepath-validation/validate.cjs environment
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $files = node config/scripts/pr-package-test-paths.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($files.Count -ne 79) { throw 'Expected79 Windows boundary files' }
          [IO.File]::WriteAllText('.build/hook-stdin-psmodulepath-validation/selected-files.json', (ConvertTo-Json -InputObject @($files)))
          node node_modules/vitest/vitest.mjs run --config config/vitest.config.ts --reporter=default --reporter=json --outputFile=.build/hook-stdin-psmodulepath-validation/full-results.json @files
          $code = $LASTEXITCODE
          [IO.File]::WriteAllText('.build/hook-stdin-psmodulepath-validation/full-exit-code.txt', [string]$code)
          exit $code
      - name: Prepare guard-only abandoned-stdin negative control (sanitized jobs)
        id: negative_prepare
        if: always() && matrix.environment == 'sanitized'
        shell: pwsh
        run: |
          node .build/hook-stdin-psmodulepath-validation/validate.cjs negative
          exit $LASTEXITCODE
      - name: Negative control must fail on abandoned stdin at10s
        id: negative
        if: always() && matrix.environment == 'sanitized' && steps.negative_prepare.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        env:
          ORCA_REAL_WINDOWS_SKILL_TEST: '1'
        run: |
          node node_modules/vitest/vitest.mjs run --config config/vitest.config.ts --reporter=default --reporter=json --outputFile=.build/hook-stdin-psmodulepath-validation/negative-results.json src/main/agent-hooks/managed-hook-stdin-lifecycle.test.ts -t 'exits 0 for every local script and missing-script launcher, dropping stdin only without Orca env'
          $code = $LASTEXITCODE
          [IO.File]::WriteAllText('.build/hook-stdin-psmodulepath-validation/negative-exit-code.txt', [string]$code)
          exit $code
      - name: Restore original source and record final tree
        if: always()
        shell: pwsh
        run: |
          node .build/hook-stdin-psmodulepath-validation/validate.cjs restore
          exit $LASTEXITCODE
      - name: Fail closed on JSON assertions and phase bindings
        if: always()
        shell: pwsh
        run: |
          node .build/hook-stdin-psmodulepath-validation/validate.cjs verify
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: hook-stdin-psmodulepath-${{ matrix.source.name }}-${{ matrix.environment }}-${{ github.run_id }}
          path: .build/hook-stdin-psmodulepath-validation/
          include-hidden-files: true
          if-no-files-found: error
