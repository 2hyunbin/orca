name: Verified recovery self-exit platform qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  self-exit:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      ORCA_BACKGROUND_LAUNCH: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 496fba759b4481104d2938c961b67f63fa6100d9
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: none
      - name: Exercise actual exported shutdown function in owned children
        shell: bash
        run: |
          cat > qualification-exit.mjs <<'JAVASCRIPT'
          import assert from 'node:assert/strict'
          import { createRequire } from 'node:module'
          import { pathToFileURL } from 'node:url'
          import { resolve } from 'node:path'
          const require = createRequire(import.meta.url)
          const { runProcess } = require('@orca/process-host')
          const source = pathToFileURL(resolve('src/main/daemon/daemon-rpc-process-exit.ts')).href
          const results = []
          for (const mode of [undefined, 'verified-stalled-owner']) {
            const code = `import { exitDaemonAfterRpcShutdown } from ${JSON.stringify(source)}; exitDaemonAfterRpcShutdown(${JSON.stringify(mode)});`
            const result = await runProcess({
              program: process.execPath,
              args: ['--input-type=module', '--eval', code],
              timeoutMs: 10000,
              env: { ...process.env, ORCA_BACKGROUND_LAUNCH: '1' }
            })
            assert.equal(result.timedOut, false, JSON.stringify(result))
            if (mode === undefined) {
              assert.equal(result.code, 0, JSON.stringify(result))
              assert.equal(result.signal, null)
            } else {
              assert(result.signal === 'SIGKILL' || (process.platform === 'win32' && result.code === 1), JSON.stringify(result))
            }
            results.push({ mode: mode ?? 'normal', code: result.code, signal: result.signal })
          }
          console.log(JSON.stringify({ platform: process.platform, arch: process.arch, node: process.version, source: '496fba759b4481104d2938c961b67f63fa6100d9', results }))
          JAVASCRIPT
          node qualification-exit.mjs
