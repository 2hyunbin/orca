name: Frozen preflight critical-path replay
'on':
  workflow_dispatch: null
permissions:
  contents: read
env:
  ORCA_BACKGROUND_LAUNCH: '1'
jobs:
  baseline-0:
    name: baseline-0
    if: always()
    runs-on: ubuntu-24.04-arm
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 50
        persist-credentials: false
        ref: ea44810149e9c68e2718163aeffe83eff96efa6e
    - uses: ./.github/actions/install-node-dependencies
      if: '''false'' != ''true'''
      with:
        native-runtime: node
        node-version: '24'
    - uses: ./.github/actions/install-node-dependencies
      if: '''false'' == ''true'''
      with:
        native-runtime: node
        node-version: '24'
        cache-dependency-path: 'pnpm-lock.yaml

          mobile/pnpm-lock.yaml

          '
    - name: Set up Bun for preflight checks
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: 1.4.3
    - name: Select check implementations
      run: 'git show 845b723258c0502365ef8ea29392a3badc8cbeae:package.json > package.json

        git show 845b723258c0502365ef8ea29392a3badc8cbeae:config/scripts/runtime-serve-terminal-smoke.mjs > config/scripts/runtime-serve-terminal-smoke.mjs

        git show 845b723258c0502365ef8ea29392a3badc8cbeae:config/scripts/check-main-sync-spawn-ratchet.mjs > config/scripts/check-main-sync-spawn-ratchet.mjs

        git show 845b723258c0502365ef8ea29392a3badc8cbeae:config/scripts/run-typecheck-projects-in-parallel.mjs > config/scripts/run-typecheck-projects-in-parallel.mjs'
    - name: Check process-host imports
      if: '!cancelled()'
      id: process-host-imports
      background: true
      env:
        PREFLIGHT_PHASE_SELECTED: ${{ 'true' == 'true' }}
        PREFLIGHT_PRIOR_SUCCESS: ${{ job.status == 'success' }}
      run: 'if [ "$PREFLIGHT_PHASE_SELECTED" != true ] || [ "$PREFLIGHT_PRIOR_SUCCESS" != true ]; then exit 0; fi

        bun --bun run check:process-host-imports

        '
    - name: Check main-process sync launches
      if: '!cancelled()'
      id: main-sync-spawn-ratchet
      background: true
      env:
        PREFLIGHT_PHASE_SELECTED: ${{ 'true' == 'true' }}
        PREFLIGHT_PRIOR_SUCCESS: ${{ job.status == 'success' }}
      run: 'if [ "$PREFLIGHT_PHASE_SELECTED" != true ] || [ "$PREFLIGHT_PRIOR_SUCCESS" != true ]; then exit 0; fi

        bun --bun run check:main-sync-spawn-ratchet

        '
    - name: Lint
      if: '!cancelled()'
      id: root-lint
      background: true
      env:
        PREFLIGHT_PHASE_SELECTED: ${{ 'true' == 'true' }}
        PREFLIGHT_PRIOR_SUCCESS: ${{ job.status == 'success' }}
      run: 'if [ "$PREFLIGHT_PHASE_SELECTED" != true ] || [ "$PREFLIGHT_PRIOR_SUCCESS" != true ]; then exit 0; fi

        pnpm exec oxlint --format github

        '
    - name: Reject low-evidence patterns
      if: '''true'' == ''true'''
      run: 'node config/scripts/sync-anti-slop-plugin.mjs

        bun --smol node_modules/oxlint/bin/oxlint --config config/oxlint-anti-slop.json src config tests mobile --deny-warnings

        '
    - wait: root-lint
    - name: Enforce focused code-quality plugins
      if: '!cancelled()'
      id: native-code-quality
      background: true
      env:
        PREFLIGHT_PHASE_SELECTED: ${{ 'true' == 'true' }}
        PREFLIGHT_PRIOR_SUCCESS: ${{ job.status == 'success' }}
      run: 'if [ "$PREFLIGHT_PHASE_SELECTED" != true ] || [ "$PREFLIGHT_PRIOR_SUCCESS" != true ]; then exit 0; fi

        pnpm run audit:code-quality:native

        '
    - name: Enforce type-aware code-quality baseline
      if: '''true'' == ''true'''
      run: pnpm run audit:code-quality:type-aware
    - wait: native-code-quality
    - uses: ./.github/actions/install-mobile-dependencies
      if: '''true'' == ''true'' && ''false'' == ''true'''
    - name: Enforce changed-code quality
      if: '!cancelled()'
      id: changed-code-quality
      background: true
      env:
        PREFLIGHT_PHASE_SELECTED: ${{ 'true' == 'true' }}
        PREFLIGHT_PRIOR_SUCCESS: ${{ job.status == 'success' }}
      run: 'if [ "$PREFLIGHT_PHASE_SELECTED" != true ] || [ "$PREFLIGHT_PRIOR_SUCCESS" != true ]; then exit 0; fi

        pnpm run check:code-quality:changed -- "845b723258c0502365ef8ea29392a3badc8cbeae"

        '
    - name: Enforce React Doctor on changed lines
      if: '''true'' == ''true'''
      run: pnpm run check:react-doctor:changed -- "845b723258c0502365ef8ea29392a3badc8cbeae"
    - wait: changed-code-quality
    - name: Typecheck
      if: '!cancelled()'
      id: typecheck
      background: true
      env:
        PREFLIGHT_PHASE_SELECTED: ${{ 'true' == 'true' }}
        PREFLIGHT_PRIOR_SUCCESS: ${{ job.status == 'success' }}
      run: 'if [ "$PREFLIGHT_PHASE_SELECTED" != true ] || [ "$PREFLIGHT_PRIOR_SUCCESS" != true ]; then exit 0; fi

        pnpm run typecheck:ci --bun-concurrency=2 --bun-threads=2

        '
    - name: Check Zustand selector fan-out budget
      if: '''true'' == ''true'''
      run: pnpm run check:zustand-selector-fanout
    - name: Check reliability gate manifest
      if: '''true'' == ''true'''
      run: pnpm run check:reliability-gates
    - name: Enforce dead design-system classes
      if: '''true'' == ''true'''
      run: pnpm run check:dead-classes
    - name: Check VM runtime rollback compatibility
      if: '''true'' == ''true'''
      env:
        BASE_SHA: 845b723258c0502365ef8ea29392a3badc8cbeae
      run: "DIFF_BASE=\"$(node config/scripts/git-pull-request-diff-base.mjs \"$BASE_SHA\")\"\nif git diff --quiet \"$DIFF_BASE\" HEAD -- \\\n  src/shared/ephemeral-vm-runtime-store.ts \\\n  src/shared/ephemeral-vm-runtime-feature-store.ts \\\n  src/shared/ephemeral-vm-runtime-rollback-projection.ts \\\n  src/shared/ephemeral-vm-runtimes.ts \\\n  src/shared/ephemeral-vm-recipes.ts \\\n  src/shared/orca-yaml-hook-types.ts \\\n  src/main/ephemeral-vm-runtime-service.ts \\\n  src/main/ephemeral-vm-runtime-provisioning-persistence.ts \\\n  src/main/ephemeral-vm-failed-start-cleanup.ts; then\n  echo \"VM runtime persistence is unchanged.\"\n  exit 0\nfi\nnode config/scripts/run-ephemeral-vm-runtime-store-rollback-repro.mjs \\\n  config/scripts/ephemeral-vm-runtime-store-cross-version.test.ts\n"
    - name: Enforce max-lines ratchet
      if: '''true'' == ''true'''
      run: pnpm run check:max-lines-ratchet
    - name: Enforce ts-nocheck ratchet
      if: '''true'' == ''true'''
      run: pnpm run check:ts-nocheck-ratchet
    - name: Enforce runtime Electron-import ratchet
      if: '''true'' == ''true'''
      run: pnpm run check:runtime-electron-ratchet
    - name: Enforce focus-read ratchet
      if: '''true'' == ''true'''
      run: pnpm run check:focus-read-ratchet
    - name: Enforce layout-writer ratchets
      if: '''true'' == ''true'''
      run: pnpm run check:layout-writer-ratchets
    - name: Check compatibility-folder imports
      if: '''true'' == ''true'''
      run: bun config/scripts/check-compat-boundary-imports.mjs
    - name: Check Node runtime pin
      if: '''true'' == ''true'''
      run: pnpm run check:node-runtime-pin
    - name: Verify localization extraction
      if: '!cancelled()'
      id: localization-extraction
      background: true
      env:
        PREFLIGHT_PHASE_SELECTED: ${{ 'true' == 'true' }}
        PREFLIGHT_PRIOR_SUCCESS: ${{ job.status == 'success' }}
        BASE_SHA: 845b723258c0502365ef8ea29392a3badc8cbeae
      run: "if [ \"$PREFLIGHT_PHASE_SELECTED\" != true ] || [ \"$PREFLIGHT_PRIOR_SUCCESS\" != true ]; then exit 0; fi\n# Detection failures run the full check; renames retain the removed input path.\nDIFF_BASE=\"$(node config/scripts/git-pull-request-diff-base.mjs \"$BASE_SHA\")\"\nif git diff --name-only --no-renames -z \"$DIFF_BASE\" HEAD > \"$RUNNER_TEMP/localization-changes\" &&\n  scope=\"$(node config/scripts/localization-extraction-change-scope.mjs \"$RUNNER_TEMP/localization-changes\")\" && [ \"$scope\" = false ]; then\n  echo \"Localization extraction inputs are unchanged.\"\nelse\n  bun config/scripts/verify-localization-extraction.mjs\nfi\n"
    - name: Boot orcad and round-trip a terminal
      if: '''true'' == ''true'''
      env:
        BASE_SHA: 845b723258c0502365ef8ea29392a3badc8cbeae
        ORCA_BACKGROUND_LAUNCH: '1'
      run: "# Detection failures run the smoke; renames retain the removed input path.\nDIFF_BASE=\"$(node config/scripts/git-pull-request-diff-base.mjs \"$BASE_SHA\")\"\nif git diff --name-only --no-renames -z \"$DIFF_BASE\" HEAD > \"$RUNNER_TEMP/orcad-smoke-changes\" &&\n  scope=\"$(node config/scripts/orcad-terminal-smoke-change-scope.mjs \"$RUNNER_TEMP/orcad-smoke-changes\")\" && [ \"$scope\" = false ]; then\n  echo \"Orcad terminal smoke inputs are unchanged.\"\nelse\n  pnpm run smoke:orcad-terminal\nfi\n"
    - name: Verify the generated RPC params catalog
      if: '''true'' == ''true'''
      run: pnpm run verify:rpc-params-catalog
    - name: Verify the generated ACP protocol schema
      if: '''true'' == ''true'''
      run: pnpm run verify:acp-protocol
    - name: Verify bundled skill guides
      if: '''true'' == ''true'''
      run: pnpm run verify:bundled-skill-guides
    - name: Verify skill freshness manifest
      if: '''true'' == ''true'''
      run: pnpm run verify:skill-bundle-manifest
    - name: Verify localization catalogs
      if: '!cancelled()'
      id: localization-catalogs
      background: true
      env:
        PREFLIGHT_PHASE_SELECTED: ${{ 'true' == 'true' }}
        PREFLIGHT_PRIOR_SUCCESS: ${{ job.status == 'success' }}
      run: 'if [ "$PREFLIGHT_PHASE_SELECTED" != true ] || [ "$PREFLIGHT_PRIOR_SUCCESS" != true ]; then exit 0; fi

        pnpm run verify:localization-catalogs

        '
    - name: Verify localization coverage
      if: '''true'' == ''true'''
      run: pnpm run verify:localization-coverage
    - wait:
      - localization-catalogs
      - localization-extraction
    - name: Guard against project-owned .d.ts in preload/shared
      if: '''true'' == ''true'''
      run: "matches=$(find src/preload src/shared -name '*.d.ts' 2>/dev/null || true)\nif [ -n \"$matches\" ]; then\n  echo \"::error::Project-owned .d.ts files are not allowed under src/preload or src/shared.\"\n  echo \"Move type declarations into a .ts file so skipLibCheck does not hide errors.\"\n  echo \"See .github/CONTRIBUTING.md#type-declarations-prefer-ts-over-dts.\"\n  echo \"Found:\"\n  echo \"$matches\"\n  exit 1\nfi\n"
    - name: Check feature wall asset budget
      if: '''true'' == ''true'''
      run: pnpm check:feature-wall-assets
    - name: Verify macOS entitlements
      if: '''true'' == ''true'''
      run: pnpm verify:macos-entitlements
    - name: Plan unit selection
      if: '!cancelled()'
      id: unit-plan
      background: true
      env:
        PREFLIGHT_PHASE_SELECTED: ${{ 'true' == 'true' }}
        PREFLIGHT_PRIOR_SUCCESS: ${{ job.status == 'success' }}
        ORCA_UNIT_SELECTION_MODE: ${{ vars.ORCA_UNIT_SELECTION_MODE || 'shadow' }}
        ORCA_UNIT_FULL_SHARD_COUNT: ${{ vars.ORCA_UNIT_FULL_SHARD_COUNT || '5' }}
      run: 'if [ "$PREFLIGHT_PHASE_SELECTED" != true ] || [ "$PREFLIGHT_PRIOR_SUCCESS" != true ]; then exit 0; fi

        cat > "$RUNNER_TEMP/replay-event.json" <<''JSON''

        {"pull_request": {"number": 28106, "draft": false, "base": {"sha": "845b723258c0502365ef8ea29392a3badc8cbeae", "ref": "main"}, "head": {"sha": "ea44810149e9c68e2718163aeffe83eff96efa6e", "ref": "nwparker/preflight-critical-path"}, "title": "Speed up daemon smoke checks and keep compiler slots busy", "body": ""}, "repository": {"full_name": "stablyai/orca"}}

        JSON

        GITHUB_EVENT_PATH="$RUNNER_TEMP/replay-event.json" GITHUB_EVENT_NAME=pull_request node config/scripts/ci-unit-plan.mjs

        '
    - wait: typecheck
    - wait: process-host-imports
    - wait: main-sync-spawn-ratchet
    - wait: unit-plan
    - uses: actions/upload-artifact@v7
      if: '''true'' == ''true'''
      with:
        name: critical-replay-baseline-0
        path: ci-shards/unit-selection.json
