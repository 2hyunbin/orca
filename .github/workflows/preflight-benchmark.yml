name: Windows taskkill deadline diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  ORCA_BACKGROUND_LAUNCH: '1'
jobs:
  stress:
    name: Taskkill (${{ matrix.fixture }}, runner ${{ matrix.replica }}, deadline ${{ matrix.deadline }})
    runs-on: windows-2022
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        fixture: [ready]
        deadline: [30000, 90000]
        replica: [1, 2]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Select fixture and record source
        shell: pwsh
        env:
          FIXTURE: ${{ matrix.fixture }}
        run: |
          New-Item -ItemType Directory -Force .build/taskkill-comparison | Out-Null
          git rev-parse HEAD | Set-Content .build/taskkill-comparison/source.txt
          $testFile = 'src/shared/__tests__/process-host/windows-tree-kill-late-taskkill.win32.test.ts'
          if ($env:FIXTURE -eq 'baseline') {
            $original = git show 0841e09b648b718b6622a38bf9019271dbddde2d:src/shared/__tests__/process-host/windows-tree-kill-late-taskkill.win32.test.ts
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $original | Set-Content -Encoding utf8 $testFile
          }
          git diff -- $testFile | Set-Content .build/taskkill-comparison/fixture-diff.txt
          $env:FIXTURE | Set-Content .build/taskkill-comparison/fixture.txt
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: none
      - name: Repeat unchanged Windows termination stress
        shell: pwsh
        env:
          ORCA_WINDOWS_TREE_KILL_LOAD: '1'
          ORCA_DIAGNOSTIC_TASKKILL_DEADLINE: ${{ matrix.deadline }}
        run: |
          $failed = 0
          for ($iteration = 1; $iteration -le 10; $iteration++) {
            node node_modules/vitest/vitest.mjs run --config config/vitest.config.ts src/shared/__tests__/process-host/windows-tree-kill-late-taskkill.win32.test.ts --maxWorkers=1 2>&1 | Tee-Object -FilePath ".build/taskkill-comparison/stress-$iteration.log"
            $code = $LASTEXITCODE
            "iteration=$iteration exit=$code" | Add-Content .build/taskkill-comparison/outcomes.txt
            if ($code -ne 0) { $failed++ }
          }
          if ($failed -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: taskkill-${{ matrix.fixture }}-${{ matrix.replica }}-${{ matrix.deadline }}
          path: .build/taskkill-comparison/
          retention-days: 30
