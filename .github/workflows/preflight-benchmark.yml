        destination, sha256) {\n  if (!existsSync(source) || (await sha256File(source)) !== sha256) {\n    return
        false\n  }\n  mkdirSync(dirname(destination), { recursive: true })\n  copyFileSync(source, destination)\n  if
        ((await sha256File(destination)) !== sha256) {\n    rmSync(destination, { force: true })\n    throw new
        Error(`Node executable changed while copying ${source}`)\n  }\n  if (process.platform !== ''win32'') {\n    chmodSync(destination,
        0o755)\n  }\n  return true\n}\n\n/** Reuses a cached file only when it still hashes to the pin; anything
