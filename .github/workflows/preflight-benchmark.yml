  runtime:
    name: cold-runtime-reuse
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v6
      with:
        ref: 3625e2d070f145aba4cbe6b5f818a44b189b55cf
        fetch-depth: 50
        persist-credentials: false
    - uses: ./.github/actions/install-node-dependencies
      with:
        native-runtime: none
        node-version: '24'
    - name: Measure exact executable reuse
      run: "cat > .tail-runtime-benchmark.mjs <<'SCRIPT'\nimport { mkdirSync, mkdtempSync, readFileSync, rmSync,\
        \ writeFileSync } from 'node:fs'\nimport { join } from 'node:path'\nimport { performance } from 'node:perf_hooks'\n\
        import { runProcessSync } from '@orca/process-host'\nimport { measurePreflightCommand } from './config/scripts/preflight-benchmark-command.mjs'\n\
        import { buildCounterbalancedSchedule } from './config/scripts/counterbalanced-benchmark-schedule.mjs'\n\
        import { summarizeBenchmarkSamples } from './config/scripts/benchmark-sample-summary.mjs'\nimport { NODE_RUNTIME_ASSETS\
        \ } from './src/shared/node-runtime-pin.ts'\nimport { sha256File } from './config/scripts/update-node-runtime-pin.mjs'\n\
        const root=process.cwd(), output=join(root,'.build/tail-runtime')\nmkdirSync(output,{recursive:true})\n\
        const file='config/scripts/.tail-baseline-pinned-node-downloads.mjs'\nconst old=runProcessSync({program:'git',args:['show','099bb76501f82184820a1f236409e2eacbebb8ef:config/scripts/pinned-node-downloads.mjs'],cwd:root})\n\
        if(old.code!==0)throw new Error(old.stderr)\nwriteFileSync(file,old.stdout)\nconst expected=NODE_RUNTIME_ASSETS['linux-arm64-glibc'].executableSha256\n\
        const hostHash=await sha256File(process.execPath)\nconst report={source:'3625e2d070f145aba4cbe6b5f818a44b189b55cf',base:'099bb76501f82184820a1f236409e2eacbebb8ef',node:process.version,hostMatchesPin:hostHash===expected,method:'Four\
        \ counterbalanced pairs; a separate empty cache for each invocation; both outputs must match the pinned\
        \ executable hash.',measurements:[]}\nif(!report.hostMatchesPin)throw new Error('setup-node does not currently\
        \ match the executable pin')\nconst save=()=>writeFileSync(join(output,'runtime.json'),JSON.stringify(report,null,2))\n\
        try {\nfor(const [pair,order] of buildCounterbalancedSchedule(4,'baseline','candidate').entries()) {\n \
        \ for(const arm of order) {\n    const cache=mkdtempSync(join(process.env.RUNNER_TEMP,'tail-node-'))\n \
        \   const result=await measurePreflightCommand({program:process.execPath,args:[arm==='baseline'?file:'config/scripts/pinned-node-downloads.mjs','linux-arm64-glibc'],label:`runtime-${pair}-${arm}`,root,output,env:{...process.env,ORCA_NODE_RUNTIME_CACHE_DIR:cache},timeoutMs:600000})\n\
        \    if(result.code!==0||result.signal||result.timedOut)throw new Error(JSON.stringify(result))\n    const\
        \ executable=result.stdout.trim().split('\\n').at(-1)\n    if(await sha256File(executable)!==expected)throw\
        \ new Error('Wrong packaged Node bytes')\n    report.measurements.push({pair,arm,...result});save()\n  \
        \  console.log(JSON.stringify({pair,arm,durationMs:result.durationMs}))\n    rmSync(cache,{recursive:true,force:true})\n\
        \  }\n}\nreport.summary=Object.fromEntries(['baseline','candidate'].map(arm=>[arm,summarizeBenchmarkSamples(report.measurements.filter(x=>x.arm===arm).map(x=>x.durationMs))]))\n\
        save();console.log(JSON.stringify(report.summary))\n}finally{rmSync(file,{force:true})}\n\nSCRIPT\nnode\
        \ .tail-runtime-benchmark.mjs"
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: tail-runtime-reuse
        path: .build/tail-runtime/
        retention-days: 30
