        run: pnpm run verify:localization-coverage
      - wait:
          - localization-catalogs
          - localization-extraction
      - name: Guard against project-owned .d.ts in preload/shared
        if: needs.code_paths.outputs.static_analysis == 'true'
        run: |
          matches=$(find src/preload src/shared -name '*.d.ts' 2>/dev/null || true)
          if [ -n "$matches" ]; then
            echo "::error::Project-owned .d.ts files are not allowed under src/preload or src/shared."
            echo "Move type declarations into a .ts file so skipLibCheck does not hide errors."
            echo "See .github/CONTRIBUTING.md#type-declarations-prefer-ts-over-dts."
            echo "Found:"
            echo "$matches"
            exit 1
          fi
      - name: Check feature wall asset budget
        if: needs.code_paths.outputs.static_analysis == 'true'
        run: pnpm check:feature-wall-assets
      - name: Verify macOS entitlements
        if: needs.code_paths.outputs.static_analysis == 'true'
        run: pnpm verify:macos-entitlements
      - name: Plan unit selection
        if: "!cancelled()"
        id: unit-plan
        background: true
        env:
          PREFLIGHT_PHASE_SELECTED: ${{ needs.code_paths.outputs.typecheck == 'true' }}
          PREFLIGHT_PRIOR_SUCCESS: ${{ job.status == 'success' }}
          ORCA_UNIT_SELECTION_MODE: ${{ vars.ORCA_UNIT_SELECTION_MODE || 'shadow' }}
          ORCA_UNIT_FULL_SHARD_COUNT: ${{ vars.ORCA_UNIT_FULL_SHARD_COUNT || '5' }}
        run: |
          if [ "$PREFLIGHT_PHASE_SELECTED" != true ] || [ "$PREFLIGHT_PRIOR_SUCCESS" != true ]; then exit 0; fi
          GITHUB_EVENT_NAME=pull_request GITHUB_EVENT_PATH="$RUNNER_TEMP/throughput-event.json" node config/scripts/ci-unit-plan.mjs
      - wait: typecheck
      - wait: process-host-imports
      - wait: unit-plan
      - uses: actions/upload-artifact@v7
        if: needs.code_paths.outputs.typecheck == 'true'
        with:
          name: throughput-unit-selection-0-serial
          path: ci-shards/unit-selection.json
          retention-days: 14
      - name: Set up Bun for Mobile CI tool tests
        if: needs.code_paths.outputs.mobile_ci_tools == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: config/.bun-version
      - name: Test Mobile CI tools and runtime routing
        if: needs.code_paths.outputs.mobile_ci_tools == 'true'
        env:
          ORCA_BACKGROUND_LAUNCH: "1"
          ORCA_BALANCE_UNIT_SHARDS: "1"
        run: node config/scripts/run-vitest.mjs run --config config/vitest.config.ts --maxWorkers=4 --isolate --retry=0 --bail=0 config/scripts/mobile-release-check-scope.test.mjs config/scripts/mobile-test-change-scope.test.mjs config/scripts/pr-ready-check-reuse.test.mjs config/scripts/ci-dependency-download-cache.test.mjs config/scripts/win32-test-lane-registration.test.mjs config/scripts/vitest-node-runtime-boundary.test.ts config/scripts/vitest-sqlite-runtime-boundary.test.ts
    timeout-minutes: 12
  replay_1_paired:
    name: "preflight 1: paired"
    needs:
      - code_paths
