        import { writeFileSync } from ''node:fs''

        writeFileSync("config/scripts/pinned-node-downloads.mjs", "// Hash-verified downloads of the pinned Node''s
        build inputs (headers, node.lib) and executable.\nimport { chmodSync, copyFileSync, existsSync, mkdirSync,
        rmSync } from ''node:fs''\nimport { dirname, join, resolve } from ''node:path''\nimport {\n  NODE_RUNTIME_PIN,\n  isWindowsServerTarget,\n  nodeRuntimeAsset,\n  nodeRuntimeExecutablePath,\n  nodeRuntimeHeadersUrl,\n  nodeRuntimeReleaseUrl\n}
        from ''../../src/shared/node-runtime-pin.ts''\nimport { isDirectInvocation } from ''./script-entry-detection.mjs''\nimport
        { download, extract, sha256File } from ''./update-node-runtime-pin.mjs''\n\nconst ROOT = resolve(import.meta.dirname,
        ''..'', ''..'')\n\nexport function pinnedNodeCacheDir(env = process.env) {\n  return env.ORCA_NODE_RUNTIME_CACHE_DIR
        || join(ROOT, ''out'', ''node-runtime-cache'')\n}\n\n/** Reuses a cached file only when it still hashes
        to the pin; anything else is re-fetched. */\nexport async function fetchPinnedFile({ url, destination, sha256
        }) {\n  if (existsSync(destination) && (await sha256File(destination)) === sha256) {\n    return destination\n  }\n  mkdirSync(join(destination,
        ''..''), { recursive: true })\n  const partial = `${destination}.partial-${process.pid}`\n  await download(url,
        partial)\n  const actual = await sha256File(partial)\n  if (actual !== sha256) {\n    rmSync(partial, {
        force: true })\n    throw new Error(`${url} hashed ${actual}, but the Node runtime pin expects ${sha256}`)\n  }\n  rmSync(destination,
        { force: true })\n  copyFileSync(partial, destination)\n  rmSync(partial, { force: true })\n  return destination\n}\n\n/**\n
        * A node-gyp `--nodedir` for `target`, built from the pinned headers tarball.\n *\n * Why per target: on
        Windows node-gyp links `<nodedir>/Release/node.lib`, which differs by\n * arch and is not in the headers
        tarball.\n */\nexport async function preparePinnedNodeDir({ target, workDir, cacheDir = pinnedNodeCacheDir()
        }) {\n  const { version, headers } = NODE_RUNTIME_PIN\n  const tarball = await fetchPinnedFile({\n    url:
        nodeRuntimeHeadersUrl(),\n    destination: join(cacheDir, headers.file),\n    sha256: headers.sha256\n  })\n  rmSync(workDir,
        { recursive: true, force: true })\n  extract(tarball, workDir, `node-v${version}/include`)\n  const nodeDir
        = join(workDir, `node-v${version}`)\n  if (isWindowsServerTarget(target)) {\n    const lib = NODE_RUNTIME_PIN.windowsImportLibs[target]\n    const
        cached = await fetchPinnedFile({\n      url: nodeRuntimeReleaseUrl(''official'', lib.file, version),\n      destination:
        join(cacheDir, `node-v${version}-${lib.file.replace(''/'', ''-'')}`),\n      sha256: lib.sha256\n    })\n    mkdirSync(join(nodeDir,
        ''Release''), { recursive: true })\n    copyFileSync(cached, join(nodeDir, ''Release'', ''node.lib''))\n  }\n  return
        nodeDir\n}\n\n/** The pinned `node` for a default or compat `target`, verified against both hashes. */\nexport
        async function ensurePinnedNodeExecutable({ target, cacheDir = pinnedNodeCacheDir() }) {\n  const asset
        = nodeRuntimeAsset(target)\n  if (!asset) {\n    throw new Error(`The Node runtime pin has no asset for
        ${target}`)\n  }\n  const member = nodeRuntimeExecutablePath(target, asset.archive)\n  const executable
        = join(cacheDir, member)\n  if (existsSync(executable) && (await sha256File(executable)) === asset.executableSha256)
        {\n    return executable\n  }\n  const archive = await fetchPinnedFile({\n    url: nodeRuntimeReleaseUrl(asset.source,
        asset.archive),\n    destination: join(cacheDir, asset.archive),\n    sha256: asset.archiveSha256\n  })\n  extract(archive,
        cacheDir, member)\n  const actual = await sha256File(executable)\n  if (actual !== asset.executableSha256)
        {\n    throw new Error(`${member} hashed ${actual}, but the pin expects ${asset.executableSha256}`)\n  }\n  if
        (process.platform !== ''win32'') {\n    chmodSync(executable, 0o755)\n  }\n  return executable\n}\n\n//
        Usage: node config/scripts/pinned-node-downloads.mjs <target>... \u2014 warms the cache before packaging.\nif
        (isDirectInvocation(import.meta.url, process.argv[1])) {\n  for (const target of process.argv.slice(2))
        {\n    console.log(await ensurePinnedNodeExecutable({ target }))\n  }\n}\n\nexport async function copyPinnedNodeExecutable(source,
        destination, sha256) {\n  if (!existsSync(source) || (await sha256File(source)) !== sha256) {\n    return
        false\n  }\n  mkdirSync(dirname(destination), { recursive: true })\n  copyFileSync(source, destination)\n  if
        ((await sha256File(destination)) !== sha256) {\n    rmSync(destination, { force: true })\n    throw new
        Error(`Node executable changed while copying ${source}`)\n  }\n  if (process.platform !== ''win32'') {\n    chmodSync(destination,
        0o755)\n  }\n  return true\n}\n")

