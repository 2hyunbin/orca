    - name: '0 baseline: Verify localization catalogs'
      if: '!cancelled()'
      id: h0-r0-localization-catalogs
      background: true
      env:
        PREFLIGHT_PHASE_SELECTED: ${{ 'true' == 'true' }}
        PREFLIGHT_PRIOR_SUCCESS: ${{ job.status == 'success' }}
      run: 'if [ "$PREFLIGHT_PHASE_SELECTED" != true ] || [ "$PREFLIGHT_PRIOR_SUCCESS" != true ]; then exit 0; fi

        pnpm run verify:localization-catalogs

        '
    - name: '0 baseline: Verify localization coverage'
      if: '''true'' == ''true'''
      run: if [ 'baseline' = baseline ]; then pnpm run verify:localization-coverage; else bun config/scripts/audit-localization-coverage.mjs
        --check; fi
    - wait:
      - h0-r0-localization-catalogs
      - h0-r0-localization-extraction
    - name: '0 baseline: Guard against project-owned .d.ts in preload/shared'
      if: '''true'' == ''true'''
      run: "matches=$(find src/preload src/shared -name '*.d.ts' 2>/dev/null || true)\nif [ -n \"$matches\" ]; then\n\
        \  echo \"::error::Project-owned .d.ts files are not allowed under src/preload or src/shared.\"\n  echo\
        \ \"Move type declarations into a .ts file so skipLibCheck does not hide errors.\"\n  echo \"See .github/CONTRIBUTING.md#type-declarations-prefer-ts-over-dts.\"\
        \n  echo \"Found:\"\n  echo \"$matches\"\n  exit 1\nfi\n"
    - name: '0 baseline: Check feature wall asset budget'
      if: '''true'' == ''true'''
      run: pnpm check:feature-wall-assets
    - name: '0 baseline: Verify macOS entitlements'
      if: '''true'' == ''true'''
      run: pnpm verify:macos-entitlements
    - name: '0 baseline: Plan unit selection'
      if: '!cancelled()'
      id: h0-r0-unit-plan
      background: true
      env:
        PREFLIGHT_PHASE_SELECTED: ${{ 'true' == 'true' }}
        PREFLIGHT_PRIOR_SUCCESS: ${{ job.status == 'success' }}
        ORCA_UNIT_SELECTION_MODE: ${{ vars.ORCA_UNIT_SELECTION_MODE || 'shadow' }}
        ORCA_UNIT_FULL_SHARD_COUNT: ${{ vars.ORCA_UNIT_FULL_SHARD_COUNT || '5' }}
      run: 'if [ "$PREFLIGHT_PHASE_SELECTED" != true ] || [ "$PREFLIGHT_PRIOR_SUCCESS" != true ]; then exit 0; fi

        node config/scripts/ci-unit-plan.mjs

        '
    - wait: h0-r0-typecheck
    - wait: h0-r0-process-host-imports
    - wait: h0-r0-main-sync-spawn-ratchet
    - wait: h0-r0-unit-plan
    - name: '0 baseline: Record checks finish'
      run: node -e "const fs=require('node:fs'),v=JSON.parse(fs.readFileSync('.build/same-host-0-0-baseline/start.json'));v.finished=Date.now();v.durationMs=v.finished-v.started;fs.writeFileSync('.build/same-host-0-0-baseline/duration.json',JSON.stringify(v));console.log(v)"
    - name: '0 baseline: Upload measurements'
      uses: actions/upload-artifact@v7
      with:
        name: same-host-0-0-baseline
        path: '.build/same-host-0-0-baseline/

          ci-shards/unit-selection.json'
        retention-days: 14
    - name: '1 candidate: Record checks start'
      run: 'mkdir -p .build/same-host-0-1-candidate

        node -e "const fs=require(''node:fs''),cp=require(''node:child_process'');fs.writeFileSync(''.build/same-host-0-1-candidate/start.json'',JSON.stringify({started:Date.now(),arm:''candidate'',order:1,host:0,checkoutSha:cp.execFileSync(''git'',[''rev-parse'',''HEAD''],{encoding:''utf8''}).trim()}))"'
