name: Pinned Bun layout ratchet comparison
'on':
  workflow_dispatch: null
permissions:
  contents: read
env:
  ORCA_BACKGROUND_LAUNCH: '1'
jobs:
  layout:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v6
      with:
        ref: 3625e2d070f145aba4cbe6b5f818a44b189b55cf
        fetch-depth: 50
        persist-credentials: false
    - uses: ./.github/actions/install-node-dependencies
      with:
        native-runtime: none
        node-version: '24'
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: 1.4.3
    - name: Compare layout gate and verify findings
      run: "cat > .tail-layout-benchmark.mjs <<'SCRIPT'\nimport { mkdirSync, rmSync, writeFileSync } from 'node:fs'\n\
        import { join } from 'node:path'\nimport { runProcessSync } from '@orca/process-host'\nimport { measurePreflightCommand\
        \ } from './config/scripts/preflight-benchmark-command.mjs'\nimport { buildCounterbalancedSchedule } from\
        \ './config/scripts/counterbalanced-benchmark-schedule.mjs'\nimport { summarizeBenchmarkSamples } from './config/scripts/benchmark-sample-summary.mjs'\n\
        const root=process.cwd(), output=join(root,'.build/tail-layout')\nmkdirSync(output,{recursive:true})\nconst\
        \ report={source:'3625e2d070f145aba4cbe6b5f818a44b189b55cf',node:process.version,bun:runProcessSync({program:'bun',args:['--version']}).stdout.trim(),method:'Four\
        \ counterbalanced pairs of the exact old pnpm/Node command and direct Bun command. Per-file counts must\
        \ agree across the full corpus; both runtimes must reject new main and renderer writers.',measurements:[]}\n\
        if(report.bun!=='1.4.3')throw new Error('Wrong Bun version')\nconst countsFile='.tail-layout-counts.mjs'\n\
        writeFileSync(countsFile,`import {collectCurrentCounts,RATCHETS} from './config/scripts/check-layout-writer-ratchets.mjs';\
        \ console.log(JSON.stringify(RATCHETS.map(r=>[r.name??r.label,[...collectCurrentCounts(r)].sort()])));`)\n\
        const counts=runtime=>{\n  const r=runProcessSync({program:runtime,args:[countsFile],cwd:root,timeoutMs:120000})\n\
        \  if(r.code!==0)throw new Error(r.stderr)\n  return JSON.parse(r.stdout)\n}\nconst reference=counts(process.execPath)\n\
        if(JSON.stringify(reference)!==JSON.stringify(counts('bun')))throw new Error('Per-file counts changed')\n\
        report.counts=reference\nconst save=()=>writeFileSync(join(output,'layout.json'),JSON.stringify(report,null,2))\n\
        let findings\nfor(const [pair,order] of buildCounterbalancedSchedule(4,'baseline','candidate').entries())\
        \ {\n  for(const arm of order) {\n    const result=await measurePreflightCommand({program:arm==='baseline'?'pnpm':'bun',args:arm==='baseline'?['run','check:layout-writer-ratchets']:['config/scripts/check-layout-writer-ratchets.mjs'],label:`layout-${pair}-${arm}`,root,output,env:{...process.env,ORCA_BACKGROUND_LAUNCH:'1'}})\n\
        \    if(result.code!==0||result.signal||result.timedOut)throw new Error(JSON.stringify(result))\n    const\
        \ outcome=result.stdout.split('\\n').filter(l=>l.includes('Layout-writer ratchet')&&l.includes(' OK ')).join('\\\
        n')\n    if(!outcome)throw new Error('No ratchet outcome')\n    if(findings!==undefined&&findings!==outcome)throw\
        \ new Error('CLI findings differ')\n    findings=outcome\n    report.measurements.push({pair,arm,...result});save();console.log(JSON.stringify({pair,arm,durationMs:result.durationMs,peakRssKiB:result.peakRssKiB}))\n\
        \  }\n}\nconst probes=['src/main/preflight-layout-negative-probe.ts','src/renderer/src/preflight-layout-negative-probe.ts']\n\
        try {\n  writeFileSync(probes[0],'store.setWorkspaceSession(next, hostId)\\n')\n  writeFileSync(probes[1],'set({\
        \ tabsByWorktree: next })\\n')\n  const staged=runProcessSync({program:'git',args:['add','--',...probes],cwd:root})\n\
        \  if(staged.code!==0)throw new Error(staged.stderr)\n  let errors\n  for(const program of [process.execPath,'bun'])\
        \ {\n    const result=runProcessSync({program,args:['config/scripts/check-layout-writer-ratchets.mjs'],cwd:root,timeoutMs:120000})\n\
        \    if(result.code!==1||!probes.every(file=>result.stderr.includes(file)))throw new Error('Forbidden writer\
        \ was not rejected')\n    const normalized=result.stderr.split('\\n').filter(l=>l.includes('::error')).join('\\\
        n')\n    if(errors!==undefined&&errors!==normalized)throw new Error('Negative findings differ')\n    errors=normalized\n\
        \  }\n  report.negative='Both runtimes reject the same new main and renderer writers.'\n}finally{\n  runProcessSync({program:'git',args:['reset','--',...probes],cwd:root})\n\
        \  for(const file of [...probes,countsFile])rmSync(file,{force:true})\n}\nreport.summary=Object.fromEntries(['baseline','candidate'].map(arm=>[arm,summarizeBenchmarkSamples(report.measurements.filter(x=>x.arm===arm).map(x=>x.durationMs))]))\n\
        save();console.log(JSON.stringify(report.summary))\n\nSCRIPT\nnode .tail-layout-benchmark.mjs"
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: tail-layout-ratchet
        path: .build/tail-layout/
        retention-days: 30
