    - name: Check compatibility-folder imports
      if: '''true'' == ''true'''
      run: bun config/scripts/check-compat-boundary-imports.mjs
    - name: Check Node runtime pin
      if: '''true'' == ''true'''
      run: pnpm run check:node-runtime-pin
    - name: Verify localization extraction
      if: '!cancelled()'
      id: localization-extraction
      background: true
      env:
        PREFLIGHT_PHASE_SELECTED: ${{ 'true' == 'true' }}
        PREFLIGHT_PRIOR_SUCCESS: ${{ job.status == 'success' }}
        BASE_SHA: 845b723258c0502365ef8ea29392a3badc8cbeae
      run: "if [ \"$PREFLIGHT_PHASE_SELECTED\" != true ] || [ \"$PREFLIGHT_PRIOR_SUCCESS\" != true ]; then exit 0; fi\n# Detection failures run the full check; renames retain the removed input path.\nDIFF_BASE=\"$(node config/scripts/git-pull-request-diff-base.mjs \"$BASE_SHA\")\"\nif git diff --name-only --no-renames -z \"$DIFF_BASE\" HEAD > \"$RUNNER_TEMP/localization-changes\" &&\n  scope=\"$(node config/scripts/localization-extraction-change-scope.mjs \"$RUNNER_TEMP/localization-changes\")\" && [ \"$scope\" = false ]; then\n  echo \"Localization extraction inputs are unchanged.\"\nelse\n  bun config/scripts/verify-localization-extraction.mjs\nfi\n"
    - name: Boot orcad and round-trip a terminal
      if: '''true'' == ''true'''
      env:
        BASE_SHA: 845b723258c0502365ef8ea29392a3badc8cbeae
        ORCA_BACKGROUND_LAUNCH: '1'
      run: "# Detection failures run the smoke; renames retain the removed input path.\nDIFF_BASE=\"$(node config/scripts/git-pull-request-diff-base.mjs \"$BASE_SHA\")\"\nif git diff --name-only --no-renames -z \"$DIFF_BASE\" HEAD > \"$RUNNER_TEMP/orcad-smoke-changes\" &&\n  scope=\"$(node config/scripts/orcad-terminal-smoke-change-scope.mjs \"$RUNNER_TEMP/orcad-smoke-changes\")\" && [ \"$scope\" = false ]; then\n  echo \"Orcad terminal smoke inputs are unchanged.\"\nelse\n  pnpm run smoke:orcad-terminal\nfi\n"
    - name: Verify the generated RPC params catalog
      if: '''true'' == ''true'''
      run: pnpm run verify:rpc-params-catalog
    - name: Verify the generated ACP protocol schema
      if: '''true'' == ''true'''
      run: pnpm run verify:acp-protocol
    - name: Verify bundled skill guides
      if: '''true'' == ''true'''
      run: pnpm run verify:bundled-skill-guides
    - name: Verify skill freshness manifest
      if: '''true'' == ''true'''
      run: pnpm run verify:skill-bundle-manifest
    - name: Verify localization catalogs
      if: '!cancelled()'
      id: localization-catalogs
      background: true
      env:
        PREFLIGHT_PHASE_SELECTED: ${{ 'true' == 'true' }}
        PREFLIGHT_PRIOR_SUCCESS: ${{ job.status == 'success' }}
      run: 'if [ "$PREFLIGHT_PHASE_SELECTED" != true ] || [ "$PREFLIGHT_PRIOR_SUCCESS" != true ]; then exit 0; fi

        pnpm run verify:localization-catalogs

        '
    - name: Verify localization coverage
      if: '''true'' == ''true'''
      run: pnpm run verify:localization-coverage
    - wait:
      - localization-catalogs
      - localization-extraction
    - name: Guard against project-owned .d.ts in preload/shared
      if: '''true'' == ''true'''
      run: "matches=$(find src/preload src/shared -name '*.d.ts' 2>/dev/null || true)\nif [ -n \"$matches\" ]; then\n  echo \"::error::Project-owned .d.ts files are not allowed under src/preload or src/shared.\"\n  echo \"Move type declarations into a .ts file so skipLibCheck does not hide errors.\"\n  echo \"See .github/CONTRIBUTING.md#type-declarations-prefer-ts-over-dts.\"\n  echo \"Found:\"\n  echo \"$matches\"\n  exit 1\nfi\n"
    - name: Check feature wall asset budget
      if: '''true'' == ''true'''
      run: pnpm check:feature-wall-assets
    - name: Verify macOS entitlements
      if: '''true'' == ''true'''
      run: pnpm verify:macos-entitlements
    - name: Plan unit selection
      if: '!cancelled()'
      id: unit-plan
      background: true
      env:
        PREFLIGHT_PHASE_SELECTED: ${{ 'true' == 'true' }}
        PREFLIGHT_PRIOR_SUCCESS: ${{ job.status == 'success' }}
        ORCA_UNIT_SELECTION_MODE: ${{ vars.ORCA_UNIT_SELECTION_MODE || 'shadow' }}
        ORCA_UNIT_FULL_SHARD_COUNT: ${{ vars.ORCA_UNIT_FULL_SHARD_COUNT || '5' }}
      run: 'if [ "$PREFLIGHT_PHASE_SELECTED" != true ] || [ "$PREFLIGHT_PRIOR_SUCCESS" != true ]; then exit 0; fi

        cat > "$RUNNER_TEMP/replay-event.json" <<''JSON''

        {"pull_request": {"number": 28106, "draft": false, "base": {"sha": "845b723258c0502365ef8ea29392a3badc8cbeae", "ref": "main"}, "head": {"sha": "ea44810149e9c68e2718163aeffe83eff96efa6e", "ref": "nwparker/preflight-critical-path"}, "title": "Speed up daemon smoke checks and keep compiler slots busy", "body": ""}, "repository": {"full_name": "stablyai/orca"}}

        JSON

        GITHUB_EVENT_PATH="$RUNNER_TEMP/replay-event.json" GITHUB_EVENT_NAME=pull_request node config/scripts/ci-unit-plan.mjs

        '
    - wait: typecheck
    - wait: process-host-imports
    - wait: main-sync-spawn-ratchet
    - wait: unit-plan
    - uses: actions/upload-artifact@v7
      if: '''true'' == ''true'''
      with:
        name: critical-replay-baseline-3
        path: ci-shards/unit-selection.json
        retention-days: 14
    - name: Set up Bun for Mobile CI tool tests
      if: '''false'' == ''true'''
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version-file: config/.bun-version
    - name: Test Mobile CI tools and runtime routing
      if: '''false'' == ''true'''
      env:
        ORCA_BACKGROUND_LAUNCH: '1'
        ORCA_BALANCE_UNIT_SHARDS: '1'
      run: node config/scripts/run-vitest.mjs run --config config/vitest.config.ts --maxWorkers=4 --isolate --retry=0 --bail=0 config/scripts/mobile-release-check-scope.test.mjs config/scripts/mobile-test-change-scope.test.mjs config/scripts/pr-ready-check-reuse.test.mjs config/scripts/ci-dependency-download-cache.test.mjs config/scripts/win32-test-lane-registration.test.mjs config/scripts/vitest-node-runtime-boundary.test.ts config/scripts/vitest-sqlite-runtime-boundary.test.ts
    timeout-minutes: 15
