name: Import and coverage performance experiment
'on':
  push:
    branches:
    - nwparker/preflight-import-bench
  workflow_dispatch: null
permissions:
  contents: read
env:
  ORCA_BACKGROUND_LAUNCH: '1'
jobs:
  code_paths:
    runs-on: ubuntu-slim
    outputs:
      static_analysis: 'true'
      typecheck: 'true'
      mobile_dependencies: 'false'
      mobile_ci_tools: 'false'
    steps:
    - run: echo "Same source, fresh runner, full root checks."
  replay:
    name: replay ${{ matrix.order }} ${{ matrix.arm }}
    needs:
    - code_paths
    runs-on: ubuntu-24.04-arm
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 50
        persist-credentials: false
        ref: 26cb135c77ffbc2c9dc06e1f5596bc735610b73f
    - uses: ./.github/actions/install-node-dependencies
      if: needs.code_paths.outputs.mobile_dependencies != 'true'
      with:
        native-runtime: node
        node-version: '24'
        cache-pnpm-store: 'false'
    - uses: ./.github/actions/install-node-dependencies
      if: needs.code_paths.outputs.mobile_dependencies == 'true'
      with:
        native-runtime: node
        node-version: '24'
        cache-dependency-path: 'pnpm-lock.yaml

          mobile/pnpm-lock.yaml

          '
        cache-pnpm-store: 'false'
    - name: Set up Bun for preflight checks
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version-file: config/.bun-version
    - name: Record checks start
      run: 'mkdir -p .build/import-replay

        node -e "require(''node:fs'').writeFileSync(''.build/import-replay/start.json'', JSON.stringify({started:Date.now(),arm:''${{
        matrix.arm }}'',order:${{ matrix.order }}}))"'
    - name: Check process-host imports
      if: '!cancelled()'
      id: process-host-imports
      background: true
      env:
        PREFLIGHT_PHASE_SELECTED: ${{ needs.code_paths.outputs.static_analysis == 'true' }}
        PREFLIGHT_PRIOR_SUCCESS: ${{ job.status == 'success' }}
      run: "if [ \"$PREFLIGHT_PHASE_SELECTED\" != true ] || [ \"$PREFLIGHT_PRIOR_SUCCESS\" != true ]; then exit\
        \ 0; fi\nif [ '${{ matrix.arm }}' = baseline ]; then\n  bun --bun run check:process-host-imports\nelse\n\
        \  bun config/scripts/check-import-boundaries.mjs\nfi\n"
    - name: Check main-process sync launches
      if: '!cancelled()'
      id: main-sync-spawn-ratchet
      background: true
      env:
        PREFLIGHT_PHASE_SELECTED: ${{ needs.code_paths.outputs.static_analysis == 'true' }}
        PREFLIGHT_PRIOR_SUCCESS: ${{ job.status == 'success' }}
      run: 'if [ "$PREFLIGHT_PHASE_SELECTED" != true ] || [ "$PREFLIGHT_PRIOR_SUCCESS" != true ]; then exit 0; fi

        bun --bun run check:main-sync-spawn-ratchet

        '
    - name: Lint
      if: '!cancelled()'
      id: root-lint
      background: true
      env:
        PREFLIGHT_PHASE_SELECTED: ${{ needs.code_paths.outputs.static_analysis == 'true' }}
        PREFLIGHT_PRIOR_SUCCESS: ${{ job.status == 'success' }}
      run: 'if [ "$PREFLIGHT_PHASE_SELECTED" != true ] || [ "$PREFLIGHT_PRIOR_SUCCESS" != true ]; then exit 0; fi

        pnpm exec oxlint --format github

        '
    - name: Reject low-evidence patterns
      if: needs.code_paths.outputs.static_analysis == 'true'
      run: 'node config/scripts/sync-anti-slop-plugin.mjs

        bun --smol node_modules/oxlint/bin/oxlint --config config/oxlint-anti-slop.json src config tests mobile
        --deny-warnings

        '
    - wait: root-lint
    - name: Enforce focused code-quality plugins
      if: '!cancelled()'
      id: native-code-quality
      background: true
      env:
        PREFLIGHT_PHASE_SELECTED: ${{ needs.code_paths.outputs.static_analysis == 'true' }}
        PREFLIGHT_PRIOR_SUCCESS: ${{ job.status == 'success' }}
      run: 'if [ "$PREFLIGHT_PHASE_SELECTED" != true ] || [ "$PREFLIGHT_PRIOR_SUCCESS" != true ]; then exit 0; fi

        pnpm run audit:code-quality:native

        '
    - name: Enforce type-aware code-quality baseline
      if: needs.code_paths.outputs.static_analysis == 'true'
      run: pnpm run audit:code-quality:type-aware
    - wait: native-code-quality
    - uses: ./.github/actions/install-mobile-dependencies
      if: needs.code_paths.outputs.static_analysis == 'true' && needs.code_paths.outputs.mobile_dependencies ==
        'true'
    - name: Enforce changed-code quality
      if: '!cancelled()'
      id: changed-code-quality
      background: true
      env:
        PREFLIGHT_PHASE_SELECTED: ${{ needs.code_paths.outputs.static_analysis == 'true' }}
        PREFLIGHT_PRIOR_SUCCESS: ${{ job.status == 'success' }}
      run: 'if [ "$PREFLIGHT_PHASE_SELECTED" != true ] || [ "$PREFLIGHT_PRIOR_SUCCESS" != true ]; then exit 0; fi

        pnpm run check:code-quality:changed -- "099afc89625a7c3e597c8ed64c5415a9ff86604a"

        '
    - name: Enforce React Doctor on changed lines
      if: needs.code_paths.outputs.static_analysis == 'true'
      run: pnpm run check:react-doctor:changed -- "099afc89625a7c3e597c8ed64c5415a9ff86604a"
    - wait: changed-code-quality
    - name: Typecheck
      if: '!cancelled()'
      id: typecheck
      background: true
      env:
        PREFLIGHT_PHASE_SELECTED: ${{ needs.code_paths.outputs.typecheck == 'true' }}
        PREFLIGHT_PRIOR_SUCCESS: ${{ job.status == 'success' }}
      run: 'if [ "$PREFLIGHT_PHASE_SELECTED" != true ] || [ "$PREFLIGHT_PRIOR_SUCCESS" != true ]; then exit 0; fi

        pnpm run typecheck:ci --bun-concurrency=2 --bun-threads=2

        '
    - name: Check Zustand selector fan-out budget
      if: needs.code_paths.outputs.static_analysis == 'true'
      run: pnpm run check:zustand-selector-fanout
    - name: Check reliability gate manifest
      if: needs.code_paths.outputs.static_analysis == 'true'
      run: pnpm run check:reliability-gates
    - name: Enforce dead design-system classes
      if: needs.code_paths.outputs.static_analysis == 'true'
      run: pnpm run check:dead-classes
    - name: Check VM runtime rollback compatibility
      if: needs.code_paths.outputs.static_analysis == 'true'
      env:
        BASE_SHA: 099afc89625a7c3e597c8ed64c5415a9ff86604a
      run: "DIFF_BASE=\"$(node config/scripts/git-pull-request-diff-base.mjs \"$BASE_SHA\")\"\nif git diff --quiet\
        \ \"$DIFF_BASE\" HEAD -- \\\n  src/shared/ephemeral-vm-runtime-store.ts \\\n  src/shared/ephemeral-vm-runtime-feature-store.ts\
        \ \\\n  src/shared/ephemeral-vm-runtime-rollback-projection.ts \\\n  src/shared/ephemeral-vm-runtimes.ts\
        \ \\\n  src/shared/ephemeral-vm-recipes.ts \\\n  src/shared/orca-yaml-hook-types.ts \\\n  src/main/ephemeral-vm-runtime-service.ts\
        \ \\\n  src/main/ephemeral-vm-runtime-provisioning-persistence.ts \\\n  src/main/ephemeral-vm-failed-start-cleanup.ts;\
        \ then\n  echo \"VM runtime persistence is unchanged.\"\n  exit 0\nfi\nnode config/scripts/run-ephemeral-vm-runtime-store-rollback-repro.mjs\
        \ \\\n  config/scripts/ephemeral-vm-runtime-store-cross-version.test.ts\n"
    - name: Enforce max-lines ratchet
      if: needs.code_paths.outputs.static_analysis == 'true'
      run: pnpm run check:max-lines-ratchet
    - name: Enforce ts-nocheck ratchet
      if: needs.code_paths.outputs.static_analysis == 'true'
      run: pnpm run check:ts-nocheck-ratchet
    - name: Enforce runtime Electron-import ratchet
      if: needs.code_paths.outputs.static_analysis == 'true'
      run: pnpm run check:runtime-electron-ratchet
    - name: Enforce focus-read ratchet
      if: needs.code_paths.outputs.static_analysis == 'true'
      run: pnpm run check:focus-read-ratchet
    - name: Enforce layout-writer ratchets
      if: needs.code_paths.outputs.static_analysis == 'true'
      run: bun config/scripts/check-layout-writer-ratchets.mjs
    - name: Baseline compatibility-folder imports
      if: needs.code_paths.outputs.static_analysis == 'true' && matrix.arm == 'baseline'
      run: bun config/scripts/check-compat-boundary-imports.mjs
    - name: Check Node runtime pin
      if: needs.code_paths.outputs.static_analysis == 'true'
      run: pnpm run check:node-runtime-pin
    - name: Verify localization extraction
      if: '!cancelled()'
      id: localization-extraction
      background: true
      env:
        PREFLIGHT_PHASE_SELECTED: ${{ needs.code_paths.outputs.static_analysis == 'true' }}
        PREFLIGHT_PRIOR_SUCCESS: ${{ job.status == 'success' }}
        BASE_SHA: 099afc89625a7c3e597c8ed64c5415a9ff86604a
      run: "if [ \"$PREFLIGHT_PHASE_SELECTED\" != true ] || [ \"$PREFLIGHT_PRIOR_SUCCESS\" != true ]; then exit\
        \ 0; fi\n# Detection failures run the full check; renames retain the removed input path.\nDIFF_BASE=\"$(node\
        \ config/scripts/git-pull-request-diff-base.mjs \"$BASE_SHA\")\"\nif git diff --name-only --no-renames -z\
        \ \"$DIFF_BASE\" HEAD > \"$RUNNER_TEMP/localization-changes\" &&\n  scope=\"$(node config/scripts/localization-extraction-change-scope.mjs\
        \ \"$RUNNER_TEMP/localization-changes\")\" && [ \"$scope\" = false ]; then\n  echo \"Localization extraction\
        \ inputs are unchanged.\"\nelse\n  bun config/scripts/verify-localization-extraction.mjs\nfi\n"
    - name: Boot orcad and round-trip a terminal
      if: needs.code_paths.outputs.static_analysis == 'true'
      env:
        BASE_SHA: 099afc89625a7c3e597c8ed64c5415a9ff86604a
        ORCA_BACKGROUND_LAUNCH: '1'
      run: "# Detection failures run the smoke; renames retain the removed input path.\nDIFF_BASE=\"$(node config/scripts/git-pull-request-diff-base.mjs\
        \ \"$BASE_SHA\")\"\nif git diff --name-only --no-renames -z \"$DIFF_BASE\" HEAD > \"$RUNNER_TEMP/orcad-smoke-changes\"\
        \ &&\n  scope=\"$(node config/scripts/orcad-terminal-smoke-change-scope.mjs \"$RUNNER_TEMP/orcad-smoke-changes\"\
        )\" && [ \"$scope\" = false ]; then\n  echo \"Orcad terminal smoke inputs are unchanged.\"\nelse\n  pnpm\
        \ run smoke:orcad-terminal\nfi\n"
    - name: Verify the generated RPC params catalog
      if: needs.code_paths.outputs.static_analysis == 'true'
      run: pnpm run verify:rpc-params-catalog
    - name: Verify the generated ACP protocol schema
      if: needs.code_paths.outputs.static_analysis == 'true'
      run: pnpm run verify:acp-protocol
    - name: Verify bundled skill guides
      if: needs.code_paths.outputs.static_analysis == 'true'
      run: pnpm run verify:bundled-skill-guides
    - name: Verify skill freshness manifest
      if: needs.code_paths.outputs.static_analysis == 'true'
      run: pnpm run verify:skill-bundle-manifest
    - name: Verify localization catalogs
      if: '!cancelled()'
      id: localization-catalogs
      background: true
      env:
        PREFLIGHT_PHASE_SELECTED: ${{ needs.code_paths.outputs.static_analysis == 'true' }}
        PREFLIGHT_PRIOR_SUCCESS: ${{ job.status == 'success' }}
      run: 'if [ "$PREFLIGHT_PHASE_SELECTED" != true ] || [ "$PREFLIGHT_PRIOR_SUCCESS" != true ]; then exit 0; fi

        pnpm run verify:localization-catalogs

        '
    - name: Verify localization coverage
      if: needs.code_paths.outputs.static_analysis == 'true'
      run: if [ '${{ matrix.arm }}' = baseline ]; then pnpm run verify:localization-coverage; else bun config/scripts/audit-localization-coverage.mjs
        --check; fi
    - wait:
      - localization-catalogs
      - localization-extraction
    - name: Guard against project-owned .d.ts in preload/shared
      if: needs.code_paths.outputs.static_analysis == 'true'
      run: "matches=$(find src/preload src/shared -name '*.d.ts' 2>/dev/null || true)\nif [ -n \"$matches\" ]; then\n\
        \  echo \"::error::Project-owned .d.ts files are not allowed under src/preload or src/shared.\"\n  echo\
        \ \"Move type declarations into a .ts file so skipLibCheck does not hide errors.\"\n  echo \"See .github/CONTRIBUTING.md#type-declarations-prefer-ts-over-dts.\"\
        \n  echo \"Found:\"\n  echo \"$matches\"\n  exit 1\nfi\n"
    - name: Check feature wall asset budget
      if: needs.code_paths.outputs.static_analysis == 'true'
      run: pnpm check:feature-wall-assets
    - name: Verify macOS entitlements
      if: needs.code_paths.outputs.static_analysis == 'true'
      run: pnpm verify:macos-entitlements
    - name: Plan unit selection
      if: '!cancelled()'
      id: unit-plan
      background: true
      env:
        PREFLIGHT_PHASE_SELECTED: ${{ needs.code_paths.outputs.typecheck == 'true' }}
        PREFLIGHT_PRIOR_SUCCESS: ${{ job.status == 'success' }}
        ORCA_UNIT_SELECTION_MODE: ${{ vars.ORCA_UNIT_SELECTION_MODE || 'shadow' }}
        ORCA_UNIT_FULL_SHARD_COUNT: ${{ vars.ORCA_UNIT_FULL_SHARD_COUNT || '5' }}
      run: 'if [ "$PREFLIGHT_PHASE_SELECTED" != true ] || [ "$PREFLIGHT_PRIOR_SUCCESS" != true ]; then exit 0; fi

        node config/scripts/ci-unit-plan.mjs

        '
    - wait: typecheck
    - wait: process-host-imports
    - wait: main-sync-spawn-ratchet
    - wait: unit-plan
    - name: Record checks finish
      run: node -e "const fs=require('node:fs'),v=JSON.parse(fs.readFileSync('.build/import-replay/start.json'));v.finished=Date.now();v.durationMs=v.finished-v.started;fs.writeFileSync('.build/import-replay/duration.json',JSON.stringify(v));console.log(v)"
    - uses: actions/upload-artifact@v7
      if: needs.code_paths.outputs.typecheck == 'true'
      with:
        name: import-replay-${{ matrix.order }}-${{ matrix.arm }}
        path: '.build/import-replay/

          ci-shards/unit-selection.json'
        retention-days: 14
    - name: Set up Bun for Mobile CI tool tests
      if: needs.code_paths.outputs.mobile_ci_tools == 'true'
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version-file: config/.bun-version
    - name: Test Mobile CI tools and runtime routing
      if: needs.code_paths.outputs.mobile_ci_tools == 'true'
      env:
        ORCA_BACKGROUND_LAUNCH: '1'
        ORCA_BALANCE_UNIT_SHARDS: '1'
      run: node config/scripts/run-vitest.mjs run --config config/vitest.config.ts --maxWorkers=4 --isolate --retry=0
        --bail=0 config/scripts/mobile-release-check-scope.test.mjs config/scripts/mobile-test-change-scope.test.mjs
        config/scripts/pr-ready-check-reuse.test.mjs config/scripts/ci-dependency-download-cache.test.mjs config/scripts/win32-test-lane-registration.test.mjs
        config/scripts/vitest-node-runtime-boundary.test.ts config/scripts/vitest-sqlite-runtime-boundary.test.ts
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
        - order: 0
          arm: baseline
        - order: 1
          arm: candidate
        - order: 2
          arm: candidate
        - order: 3
          arm: baseline
        - order: 4
          arm: baseline
        - order: 5
          arm: candidate
    env:
      ORCA_BACKGROUND_LAUNCH: '1'
  components:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v6
      with:
        ref: 26cb135c77ffbc2c9dc06e1f5596bc735610b73f
        persist-credentials: false
        fetch-depth: 50
    - uses: ./.github/actions/install-node-dependencies
      with:
        native-runtime: none
        node-version: '24'
        cache-pnpm-store: 'false'
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version-file: config/.bun-version
    - name: Four paired component comparisons and negative probes
      run: "cat > .import-components.mjs <<'SCRIPT'\nimport { mkdirSync, writeFileSync, mkdtempSync, rmSync } from\
        \ 'node:fs'\nimport { join } from 'node:path'\nimport { tmpdir } from 'node:os'\nimport { createHash } from\
        \ 'node:crypto'\nimport { measurePreflightCommand } from './config/scripts/preflight-benchmark-command.mjs'\n\
        import { buildCounterbalancedSchedule } from './config/scripts/counterbalanced-benchmark-schedule.mjs'\n\
        import { summarizeBenchmarkSamples } from './config/scripts/benchmark-sample-summary.mjs'\nimport { collectProcessHostSources,\
        \ assessProcessHostImports } from './config/scripts/check-process-host-imports.mjs'\nimport { assessCompatBoundaryImports\
        \ } from './config/scripts/check-compat-boundary-imports.mjs'\nimport { collectModuleSpecifiers } from './config/scripts/static-module-specifiers.mjs'\n\
        const root=process.cwd(),output=join(root,'.build/import-components')\nmkdirSync(output,{recursive:true})\n\
        const report={source:'26cb135c77ffbc2c9dc06e1f5596bc735610b73f',measurements:[],negative:[]}\nconst save=()=>writeFileSync(join(output,'components.json'),JSON.stringify(report,null,2))\n\
        const command=(program,args,label,cwd=root)=>measurePreflightCommand({program,args,label,root:cwd,output,env:{...process.env,ORCA_BACKGROUND_LAUNCH:'1'}})\n\
        const valid=(r,label)=>{if(r.code!==0||r.signal||r.timedOut)throw new Error(`${label}: ${JSON.stringify(r)}`)}\n\
        for(const [comparison,first,second] of [['imports','baseline','candidate'],['coverage','node','bun']]){\n\
        \ let reference\n for(const [pair,order] of buildCounterbalancedSchedule(4,first,second).entries()){\n \
        \ for(const arm of order){\n   let processes\n   if(comparison==='imports'){\n    processes=arm==='baseline'?[await\
        \ command('bun',['--bun','run','check:process-host-imports'],`imports-${pair}-baseline-process`),await command('bun',['config/scripts/check-compat-boundary-imports.mjs'],`imports-${pair}-baseline-compat`)]:[await\
        \ command('bun',['config/scripts/check-import-boundaries.mjs'],`imports-${pair}-candidate`)]\n   }else{\n\
        \    processes=[await command(arm==='node'?'pnpm':'bun',arm==='node'?['run','verify:localization-coverage']:['config/scripts/audit-localization-coverage.mjs','--check'],`coverage-${pair}-${arm}`)]\n\
        \   }\n   processes.forEach(p=>valid(p,comparison))\n   const findings=processes.map(p=>p.stdout.split('\\\
        n').filter(l=>l.startsWith('[process-host-imports]')||l.startsWith('[compat-boundary-imports]')||l.startsWith('Localization\
        \ coverage')).join('\\n')).join('\\n')\n   if(!findings)throw new Error('No successful check markers')\n\
        \   if(reference!==undefined&&reference!==findings)throw new Error(`Findings changed: ${findings}`)\n  \
        \ reference=findings\n   report.measurements.push({comparison,pair,arm,durationMs:processes.reduce((a,p)=>a+p.durationMs,0),peakRssKiB:Math.max(...processes.map(p=>p.peakRssKiB??0)),processes});save()\n\
        \   console.log(JSON.stringify({comparison,pair,arm,durationMs:report.measurements.at(-1).durationMs}))\n\
        \  }\n }\n}\nconst tmp=mkdtempSync(join(tmpdir(),'import-boundary-probe-'))\ntry{\n for(const [file,text]\
        \ of Object.entries({'src/packages/process-host/package.json':JSON.stringify({exports:{'.':'./index.ts'}}),'src/packages/process-host/src/index.ts':'export\
        \ {}','config/process-host-direct-import-baseline.txt':'','src/main/probe.ts':\"import '@orca/process-host/private';\
        \ const entry='../shared/workspace-layout/old-client/inner';require(entry)\"})){\n  const path=join(tmp,file);mkdirSync(join(path,'..'),{recursive:true});writeFileSync(path,text)\n\
        \ }\n for(const runtime of [process.execPath,'bun']){\n  let reference\n  for(const arm of ['baseline','candidate']){\n\
        \   const modules=arm==='baseline'?['check-process-host-imports','check-compat-boundary-imports']:['check-import-boundaries']\n\
        \   const result=await command(runtime,['--eval',`const m=await Promise.all(${JSON.stringify(modules)}.map(n=>import(${JSON.stringify(root+'/config/scripts/')}+n+'.mjs')));process.exitCode=Math.max(...m.map(v=>v.main(${JSON.stringify(tmp)})))`],`negative-imports-${runtime==='bun'?'bun':'node'}-${arm}`)\n\
        \   if(result.code!==1||!result.stderr.includes('not a public process-host export')||!result.stderr.includes('through\
        \ its index'))throw new Error('Lost an import failure')\n   if(reference!==undefined&&reference!==result.stderr)throw\
        \ new Error('Negative diagnostics changed')\n   reference=result.stderr;report.negative.push({runtime,arm,code:result.code,diagnostics:result.stderr})\n\
        \  }\n }\n const src=join(tmp,'src/renderer/src');mkdirSync(src,{recursive:true});writeFileSync(join(src,'probe.tsx'),\"\
        export const Probe=()=> <div>Unlocalized benchmark text</div>\")\n writeFileSync(join(tmp,'config/localization-coverage-allowlist.json'),'[]')\n\
        \ let reference\n for(const runtime of [process.execPath,'bun']){\n  const result=await command(runtime,[join(root,'config/scripts/audit-localization-coverage.mjs'),'--check'],`negative-coverage-${runtime==='bun'?'bun':'node'}`,tmp)\n\
        \  if(result.code!==1||!result.stderr.includes('Unlocalized benchmark text'))throw new Error('Lost localization\
        \ failure')\n  if(reference!==undefined&&reference!==result.stderr)throw new Error('Localization failure\
        \ changed')\n  reference=result.stderr;report.negative.push({runtime,code:result.code,diagnostics:result.stderr})\n\
        \ }\n}finally{rmSync(tmp,{recursive:true,force:true})}\nreport.summary={}\nfor(const comparison of ['imports','coverage'])report.summary[comparison]=Object.fromEntries([...new\
        \ Set(report.measurements.filter(x=>x.comparison===comparison).map(x=>x.arm))].map(arm=>[arm,summarizeBenchmarkSamples(report.measurements.filter(x=>x.comparison===comparison&&x.arm===arm).map(x=>x.durationMs))]))\n\
        save();console.log(JSON.stringify(report.summary))\n\nSCRIPT\nnode .import-components.mjs"
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: import-components
        path: .build/import-components/
        retention-days: 30
