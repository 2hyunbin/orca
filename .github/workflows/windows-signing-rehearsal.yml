name: Recover signed Windows artifacts for 1.4.225
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: recover-windows-v1.4.225
  cancel-in-progress: false
jobs:
  recover:
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    env:
      ORCA_BACKGROUND_LAUNCH: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: pnpm/setup@v2
        with:
          install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
      - name: Fetch immutable release source
        shell: bash
        run: git fetch --no-tags --depth=1 origin refs/tags/v1.4.225:refs/tags/v1.4.225
      - name: Verify original release gates and tag
        run: node config/scripts/recover-1.4.225-gates.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Install verification and blockmap tools
        run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: ./.github/actions/install-signpath-module
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: 38611259486
          name: orca-windows-inner-signing-evidence-v1.4.225
          path: original-evidence
      - name: Verify original signing evidence
        run: node config/scripts/recover-1.4.225-gates.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Recover and verify the already signed Windows installer
        shell: pwsh
        run: ./config/scripts/recover-1.4.225-windows.ps1
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      - name: Verify draft before upload
        run: node config/scripts/assert-github-release-is-draft.mjs v1.4.225
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Upload verified Windows release assets
        run: gh release upload v1.4.225 dist/orca-windows-setup.exe dist/orca-windows-setup.exe.blockmap dist/latest.yml --repo stablyai/orca --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v7
        with:
          name: windows-v1.4.225-recovery-evidence
          path: recovery-evidence.txt
          if-no-files-found: error
  publish:
    needs: recover
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
      - name: Recheck original release gates and draft
        run: node config/scripts/recover-1.4.225-gates.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Verify all release assets are complete
        run: node config/scripts/verify-release-required-assets.mjs v1.4.225
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish recovered stable release
        run: gh release edit v1.4.225 --draft=false --prerelease=false --repo stablyai/orca
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Dispatch post-release checks and docs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run e2e.yml --repo stablyai/orca --ref v1.4.225 --raw-field ref=refs/tags/v1.4.225
          gh workflow run docs.yml --repo stablyai/orca --ref main --field tag=v1.4.225
  homebrew:
    needs: publish
    uses: ./.github/workflows/homebrew-bump.yml
    with:
      tag: v1.4.225
    secrets: inherit
