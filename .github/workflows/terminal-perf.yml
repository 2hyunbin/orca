name: Terminal Perf

# Bench branch only (p9-output-bench): builds origin/main's app and the same tree with PR #27578's
# src/main/daemon on one runner, then alternates them through terminal-output-bench.spec.ts.
on:
  workflow_dispatch:
    inputs:
      runs:
        description: Runs per build
        required: false
        type: string
      p9_ref:
        description: Branch whose src/main/daemon is the P9 build
        required: false
        type: string
      only:
        description: Comma-separated scenario names (empty runs the group)
        required: false
        type: string
      os:
        description: JSON array of runners
        required: false
        type: string
      groups:
        description: JSON array of groups
        required: false
        type: string

jobs:
  output-bench:
    name: output bench ${{ matrix.os }} ${{ matrix.group }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os || '["ubuntu-latest","windows-2022"]') }}
        group: ${{ fromJSON(inputs.groups || '["realistic","stress"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 170
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      ORCA_BACKGROUND_LAUNCH: '1'
      ORCA_OUTPUT_BENCH_ONLY: ${{ inputs.only }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Linux tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential python3 xvfb zsh
      - uses: pnpm/setup@v2
        with:
          install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build main and P9 app trees
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec electron-vite build --mode e2e
          mv out out-main
          git fetch --depth=1 origin "${{ inputs.p9_ref || 'p9-output-bench-p9' }}"
          git checkout FETCH_HEAD -- src/main/daemon
          git diff --cached --stat
          pnpm exec electron-vite build --mode e2e
          mv out out-p9
          git checkout HEAD -- src/main/daemon
          git clean -fdq src/main/daemon
          cmp -s out-main/main/index.js out-p9/main/index.js && { echo "P9 build is identical to main"; exit 1; } || true
      - name: Run alternating benchmark (Linux, presented on Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum env ORCA_E2E_TERMINAL_PERF_XVFB=1 node tests/e2e/terminal-output-bench-driver.mjs "${{ inputs.runs || '5' }}" bench-results/output-bench.jsonl ${{ matrix.group }}
      - name: Run alternating benchmark (Windows)
        if: runner.os == 'Windows'
        run: node tests/e2e/terminal-output-bench-driver.mjs "${{ inputs.runs || '5' }}" bench-results/output-bench.jsonl ${{ matrix.group }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: output-bench-${{ matrix.os }}-${{ matrix.group }}
          path: bench-results/output-bench.jsonl
          retention-days: 14
          if-no-files-found: warn
