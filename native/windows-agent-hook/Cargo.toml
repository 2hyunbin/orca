[package]
name = "orca-agent-hook"
version = "0.0.0"
edition = "2021"
publish = false

# Why `orca-hook`: it ships as resources\bin\orca-hook.exe; the installer copies it
# into the agent-hooks directory under each agent's managed script name.
[[bin]]
name = "orca-hook"
path = "src/main.rs"

[build-dependencies]
winresource = "0.1"

# Why: runs once per agent hook event, so it stays a small std-only utility with
# no panic machinery or debug sections, like native/windows-cli-launcher.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
